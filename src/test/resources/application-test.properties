# Used only by the automated tests: an in-memory H2 database instead of MySQL.
spring.datasource.url=jdbc:h2:mem:cybertest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.admin.email=admin@test.local
app.admin.password=AdminPass123
app.seed-demo-content=false
app.upload-dir=target/test-uploads
app.rate-limit.enabled=false
app.security.require-2fa=false