# ==========================================
# APPLICATION
# ==========================================
spring.application.name=CyberSecurityTraining
# PORT is set automatically by most hosting services (e.g. Railway).
server.port=${PORT:8080}

# ==========================================
# MYSQL DATABASE CONNECTION
# The password is read from the DB_PASSWORD environment variable
# (IntelliJ: Run > Edit Configurations > Environment variables).
# ==========================================
# Locally this uses your own MySQL. Online, set DB_URL to the hosted database address.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cybersecuritytraining?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# "update" adds any new tables/columns automatically and never deletes data.
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# FIRST ADMINISTRATOR (only used when no ADMIN account exists yet)
# ==========================================
app.admin.email=${ADMIN_EMAIL:admin@cybershield.local}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=System Administrator

# ==========================================
# TWO-FACTOR AUTHENTICATION
# true  = every account must use an authenticator app. Accounts without 2FA are
#         shown a QR code during their next sign-in and cannot skip it.
# false = 2FA is optional (users can turn it on in their profile).
# ==========================================
app.security.require-2fa=true

# Adds 4 starter training modules when the modules table is empty
# and at least one MODULE_OWNER account exists.
app.seed-demo-content=true

# ==========================================
# VIDEO UPLOADS (saved in ./uploads/videos, not in MySQL)
# ==========================================
# Online, point UPLOAD_DIR at a persistent volume (e.g. /app/uploads) so videos survive redeploys.
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1

# ==========================================
# SESSION SECURITY
# Online (HTTPS) set the COOKIE_SECURE environment variable to true.
# ==========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Behind a hosting proxy: use the real visitor IP and https scheme
# (needed for the login rate limiter and secure cookies).
server.forward-headers-strategy=framework

# Never send stack traces or internal messages to the browser.
server.error.include-stacktrace=never
server.error.include-message=never

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.cybersecurity.cybertraining=INFO