<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield — Cybersecurity Awareness</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <style>
        :root{
            --bg:#0d0d1a;--bg2:#13132a;--bg3:#1a1a3e;
            --card:#1e1e42;--card2:#252550;
            --purple:#7c3aed;--purple2:#9d5bff;--purple3:#c4a3ff;
            --cyan:#06b6d4;--cyan2:#22d3ee;
            --green:#10b981;--green2:#34d399;
            --amber:#f59e0b;--amber2:#fbbf24;
            --red:#ef4444;--red2:#f87171;
            --pink:#ec4899;--pink2:#f472b6;
            --text:#f1f5f9;--textm:#94a3b8;--textl:#64748b;
            --border:rgba(255,255,255,0.08);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;font-size:16px}
        button{cursor:pointer;font-family:'Space Grotesk',sans-serif}
        input,select,textarea{font-family:'Space Grotesk',sans-serif}
        /* Dropdown lists: dark background + light text so every option is readable */
        select{color-scheme:dark}
        select option{background:#1e1e42;color:#f1f5f9}
        select option:checked{background:#7c3aed;color:#ffffff}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:var(--bg2)}
        ::-webkit-scrollbar-thumb{background:var(--purple);border-radius:3px}
        @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(124,58,237,0.3)}50%{box-shadow:0 0 40px rgba(124,58,237,0.6)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.4)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes slide-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes badge-pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
        @keyframes hint-appear{0%{opacity:0;transform:scale(0.8) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        @keyframes notif-in{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:translateX(0)}}
        @keyframes fade-in{from{opacity:0}to{opacity:1}}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const {useState,useEffect,useRef,useCallback,useMemo}=React;

    /* ─── BACKEND API ─────────────────────────────
       All data lives in MySQL and is read/written through the Spring Boot API.
       Nothing is kept in the browser's storage.
       POST/PUT/PATCH/DELETE requests carry the CSRF token from /api/auth/csrf. */
    const api=(()=>{
        let csrf=null;
        const getCsrf=async()=>{
            if(csrf)return csrf;
            const r=await fetch('/api/auth/csrf',{credentials:'same-origin',headers:{'Accept':'application/json'}});
            if(!r.ok)throw new Error('Could not get a security token from the server.');
            csrf=await r.json();
            return csrf;
        };
        async function request(method,url,body,retried=false){
            const headers={'Accept':'application/json'};
            const opts={method,credentials:'same-origin',headers};
            if(method!=='GET'){const t=await getCsrf();headers[t.headerName]=t.token;}
            if(body instanceof FormData)opts.body=body;
            else if(body!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
            let res;
            try{res=await fetch(url,opts);}
            catch(e){throw new Error('Cannot reach the server. Make sure CyberShield is running and try again.');}
            // A stale security token gives 403: fetch a fresh one and try once more.
            if(res.status===403&&method!=='GET'&&!retried){csrf=null;return request(method,url,body,true);}
            const data=await res.json().catch(()=>null);
            if(!res.ok){
                const err=new Error((data&&data.message)||('Request failed ('+res.status+').'));
                err.status=res.status;
                if(res.status===401&&!url.startsWith('/api/auth/'))window.dispatchEvent(new Event('cs-session-expired'));
                throw err;
            }
            return data;
        }
        return{
            get:u=>request('GET',u),
            post:(u,b={})=>request('POST',u,b),
            put:(u,b)=>request('PUT',u,b),
            patch:(u,b)=>request('PATCH',u,b),
            del:u=>request('DELETE',u),
            upload:(u,formData)=>request('POST',u,formData),
            resetCsrf:()=>{csrf=null;}
        };
    })();

    /* Convert the server's user object into the shape the dashboards use. */
    const AVATAR_COLORS=['#7c3aed','#06b6d4','#10b981','#ec4899','#f59e0b'];
    const initialsOf=name=>(name||'U').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const colorFor=id=>AVATAR_COLORS[Math.abs(Number(id)||0)%AVATAR_COLORS.length];
    function toClientUser(u){
        const role=String(u.role||'USER').toUpperCase();
        return{
            id:u.id,email:u.email,name:u.name||u.email,
            role:role==='ADMIN'?'admin':role==='MODULE_OWNER'?'owner':'user',
            twoFactorEnabled:!!u.twoFactorEnabled,
            avatar:initialsOf(u.name||u.email),color:colorFor(u.id),active:true
        };
    }
    const fmtDate=d=>d?new Date(d).toLocaleDateString():'-';
    const fmtDateTime=d=>d?new Date(d).toLocaleString():'-';

    /* Turn YouTube / Vimeo links into embeddable player URLs (other links play in <video>). */
    function embedUrl(url){
        if(!url)return null;
        let m=url.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/i);
        if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1];
        m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
        if(m)return 'https://player.vimeo.com/video/'+m[1];
        return null;
    }
    function VideoPlayer({url,style}){
        const embed=embedUrl(url);
        if(embed)return <iframe src={embed} title="Training video" allow="encrypted-media; picture-in-picture; fullscreen" allowFullScreen style={{width:'100%',aspectRatio:'16/9',border:'none',borderRadius:14,background:'#000',...style}}/>;
        return <video controls src={url} style={{width:'100%',borderRadius:14,background:'#000',...style}}/>;
    }

    /* ─── SHARED UI ───────────────────────────── */
    function Toast({toasts,remove}){
        return(
            <div style={{position:'fixed',top:20,right:20,zIndex:9999,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
                {toasts.map(t=>(
                    <div key={t.id} onClick={()=>remove(t.id)} style={{background:t.type==='err'?'rgba(239,68,68,0.95)':t.type==='warn'?'rgba(245,158,11,0.95)':'rgba(16,185,129,0.95)',
                        color:'white',padding:'12px 20px',borderRadius:12,fontSize:14,fontWeight:500,
                        boxShadow:'0 8px 32px rgba(0,0,0,0.4)',animation:'notif-in 0.3s ease',
                        display:'flex',alignItems:'center',gap:10,cursor:'pointer',maxWidth:320,pointerEvents:'all'}}>
                        <span style={{fontSize:16}}>{t.type==='err'?'✕':t.type==='warn'?'⚠':'✓'}</span>{t.msg}
                    </div>
                ))}
            </div>
        );
    }
    function useToast(){
        const [toasts,setToasts]=useState([]);
        const add=useCallback((msg,type='ok')=>{
            const id=Date.now()+Math.random();
            setToasts(t=>[...t,{id,msg,type}]);
            setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000);
        },[]);
        const remove=useCallback(id=>setToasts(t=>t.filter(x=>x.id!==id)),[]);
        return{toasts,add,remove};
    }

    function Confirm({msg,onYes,onNo}){
        if(!msg)return null;
        return(
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,padding:'2rem',maxWidth:360,width:'90%',textAlign:'center',boxShadow:'0 24px 64px rgba(0,0,0,0.5)'}}>
                    <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
                    <p style={{marginBottom:24,color:'var(--textm)',lineHeight:1.6}}>{msg}</p>
                    <div style={{display:'flex',gap:10,justifyContent:'center'}}>
                        <button onClick={onNo} style={{flex:1,padding:'11px',background:'rgba(255,255,255,0.06)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:14,fontWeight:600}}>Cancel</button>
                        <button onClick={onYes} style={{flex:1,padding:'11px',background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.4)',borderRadius:10,color:'#f87171',fontSize:14,fontWeight:600}}>Delete</button>
                    </div>
                </div>
            </div>
        );
    }

    function Modal({title,onClose,children,width=560}){
        return(
            <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
                <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,width:'100%',maxWidth:width,maxHeight:'92vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 64px rgba(0,0,0,0.6)'}}>
                    <div style={{padding:'1.25rem 1.75rem',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
                        <h3 style={{fontFamily:'Syne,sans-serif',fontSize:17,fontWeight:700}}>{title}</h3>
                        <button onClick={onClose} style={{background:'rgba(255,255,255,0.08)',border:'none',color:'var(--textm)',width:32,height:32,borderRadius:'50%',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
                    </div>
                    <div style={{padding:'1.5rem 1.75rem',overflowY:'auto',flex:1}}>{children}</div>
                </div>
            </div>
        );
    }

    function Inp({label,value,onChange,type='text',placeholder,rows,disabled}){
        const [focus,setFocus]=useState(false);
        const base={width:'100%',padding:'11px 14px',background:'rgba(255,255,255,0.05)',border:`1.5px solid ${focus?'var(--purple)':'var(--border)'}`,borderRadius:10,color:'var(--text)',fontSize:14,outline:'none',transition:'border-color 0.2s'};
        return(
            <div style={{marginBottom:14}}>
                {label&&<div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>{label}</div>}
                {rows
                    ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)} style={{...base,resize:'vertical'}}/>
                    : <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} disabled={disabled} onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)} style={{...base,opacity:disabled?0.5:1}}/>
                }
            </div>
        );
    }

    function Btn({children,onClick,variant='primary',size='md',disabled=false,style={}}){
        const vs={
            primary:{background:'linear-gradient(135deg,#7c3aed,#9d5bff)',color:'white',border:'none'},
            secondary:{background:'rgba(124,58,237,0.15)',color:'var(--purple2)',border:'1px solid rgba(124,58,237,0.3)'},
            danger:{background:'rgba(239,68,68,0.15)',color:'#f87171',border:'1px solid rgba(239,68,68,0.3)'},
            success:{background:'linear-gradient(135deg,#059669,#10b981)',color:'white',border:'none'},
            cyan:{background:'linear-gradient(135deg,#0891b2,#06b6d4)',color:'white',border:'none'},
            ghost:{background:'rgba(255,255,255,0.06)',color:'var(--textm)',border:'1px solid var(--border)'},
            amber:{background:'linear-gradient(135deg,#d97706,#f59e0b)',color:'white',border:'none'},
        }[variant]||{background:'linear-gradient(135deg,#7c3aed,#9d5bff)',color:'white',border:'none'};
        const ss={sm:{padding:'6px 14px',fontSize:13,borderRadius:8},md:{padding:'10px 20px',fontSize:14,borderRadius:10},lg:{padding:'13px 28px',fontSize:15,borderRadius:12}}[size]||{padding:'10px 20px',fontSize:14,borderRadius:10};
        return(
            <button onClick={onClick} disabled={disabled} style={{...vs,...ss,fontFamily:'Space Grotesk,sans-serif',fontWeight:600,cursor:disabled?'not-allowed':'pointer',opacity:disabled?0.5:1,transition:'opacity 0.2s,transform 0.15s',display:'inline-flex',alignItems:'center',gap:6,...style}}
                    onMouseEnter={e=>{if(!disabled)e.currentTarget.style.transform='translateY(-1px)'}}
                    onMouseLeave={e=>{e.currentTarget.style.transform=''}}>
                {children}
            </button>
        );
    }

    function Badge({color,children}){
        return <span style={{background:`${color}22`,color,border:`1px solid ${color}44`,fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:100,textTransform:'uppercase',letterSpacing:'0.06em',display:'inline-block'}}>{children}</span>;
    }

    function PBar({value,color='#7c3aed',height=8}){
        return(
            <div style={{background:'rgba(255,255,255,0.08)',borderRadius:100,height,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${Math.min(100,Math.max(0,value))}%`,background:`linear-gradient(90deg,${color},${color}bb)`,borderRadius:100,transition:'width 0.6s ease'}}/>
            </div>
        );
    }

    function Ava({initials,color,size=40}){
        return(
            <div style={{width:size,height:size,borderRadius:'50%',background:`linear-gradient(135deg,${color},${color}88)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.34,fontWeight:700,color:'white',flexShrink:0,boxShadow:`0 0 12px ${color}44`}}>
                {initials}
            </div>
        );
    }

    function Spinner(){
        return <div style={{width:20,height:20,border:'2px solid rgba(255,255,255,0.2)',borderTop:'2px solid white',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>;
    }

    /* ─── LOGIN ───────────────────────────────── */
    function LoginPage({onLogin}){
        const [step,setStep]=useState('creds');
        const [email,setEmail]=useState('');
        const [password,setPassword]=useState('');
        const [code,setCode]=useState('');
        const [err,setErr]=useState('');
        const [pendingUser,setPendingUser]=useState(null);
        const [loading,setLoading]=useState(false);
        const [showRegister,setShowRegister]=useState(false);
        const [showForgot,setShowForgot]=useState(false);
        const {toasts,add,remove}=useToast();
        const refs=useRef([]);

        const finishLogin=data=>{
            api.resetCsrf();
            const signedInUser=toClientUser(data.user);
            add('Welcome, '+signedInUser.name+'!','ok');
            setTimeout(()=>onLogin(signedInUser),250);
        };

        const handleCreds=async()=>{
            setErr('');setLoading(true);
            try{
                const data=await api.post('/api/auth/login',{email:email.trim(),password});
                if(data.requiresTwoFactor){setPendingUser({email:email.trim(),setup:null});setStep('2fa');setCode('');add('Enter the code from your authenticator app','ok');return;}
                if(data.requiresTwoFactorSetup){setPendingUser({email:email.trim(),setup:{qrCode:data.qrCode,secret:data.secret}});setStep('2fa');setCode('');add('Two-factor authentication is required — set it up now','warn');return;}
                if(data.authenticated){finishLogin(data);return;}
                setErr(data.message||'The server did not complete the login.');
            }catch(e){setErr(e.message);}
            finally{setLoading(false);}
        };

        const handle2FA=async()=>{
            setErr('');setLoading(true);
            try{
                const data=await api.post('/api/auth/verify-2fa',{code});
                if(!data.authenticated){setErr(data.message||'Incorrect verification code. Please try again.');return;}
                finishLogin(data);
            }catch(e){
                setErr(e.message);
                if(e.status===401&&/expired|sign in again/i.test(e.message)){setStep('creds');setCode('');}
            }
            finally{setLoading(false);}
        };

        const handleOTPInput=(i,val)=>{
            const v=val.replace(/\D/g,'');
            const arr=code.split('');arr[i]=v;
            const newCode=arr.join('').slice(0,6);
            setCode(newCode);
            if(v&&i<5)refs.current[i+1]?.focus();
            if(!v&&i>0)refs.current[i-1]?.focus();
        };

        return(
            <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden'}}>
                <Toast toasts={toasts} remove={remove}/>
                {showRegister&&(
                    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
                        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:24,width:'100%',maxWidth:440,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 24px 64px rgba(0,0,0,0.5)',padding:'2rem'}}>
                            <RegisterPage onBack={()=>setShowRegister(false)} onRegistered={()=>add('Registration submitted! Admin will review your request.','ok')}/>
                        </div>
                    </div>
                )}
                {showForgot&&(
                    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
                        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:24,width:'100%',maxWidth:440,maxHeight:'92vh',overflowY:'auto',boxShadow:'0 24px 64px rgba(0,0,0,0.5)',padding:'2rem'}}>
                            <ForgotPasswordPage initialEmail={email} onBack={()=>setShowForgot(false)}/>
                        </div>
                    </div>
                )}
                {/* Background orbs */}
                {['#7c3aed','#06b6d4','#ec4899','#10b981'].map((c,i)=>(
                    <div key={i} style={{position:'absolute',width:350+i*80,height:350+i*80,borderRadius:'50%',
                        background:`radial-gradient(circle,${c}18,transparent 70%)`,
                        top:['-8%','55%','-15%','45%'][i],left:['-8%','-12%','68%','62%'][i],
                        animation:`float ${4+i*0.7}s ease-in-out infinite`,animationDelay:`${i*0.4}s`,pointerEvents:'none'}}/>
                ))}
                <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:440,padding:20}}>
                    <div style={{textAlign:'center',marginBottom:28}}>
                        <div style={{fontSize:52,marginBottom:8,animation:'float 3s ease-in-out infinite'}}>🛡️</div>
                        <h1 style={{fontFamily:'Syne,sans-serif',fontSize:30,fontWeight:800,background:'linear-gradient(135deg,#7c3aed,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>CyberShield</h1>
                        <p style={{color:'var(--textm)',fontSize:14,marginTop:4}}>Cybersecurity Awareness Platform</p>
                    </div>

                    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:24,overflow:'hidden',boxShadow:'0 24px 64px rgba(0,0,0,0.4)'}}>
                        {step==='creds'?(
                            <div style={{padding:'2rem'}}>
                                <h2 style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:700,marginBottom:4}}>Sign In</h2>
                                <p style={{color:'var(--textm)',fontSize:13,marginBottom:24}}>Enter your credentials to continue</p>
                                {err&&<div style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',color:'#f87171',padding:'10px 14px',borderRadius:10,fontSize:13,marginBottom:16}}>{err}</div>}
                                <Inp label="Email Address" value={email} onChange={setEmail} type="email" placeholder="your@email.com"/>
                                <div onKeyDown={e=>e.key==='Enter'&&!loading&&email&&password&&handleCreds()}><Inp label="Password" value={password} onChange={setPassword} type="password" placeholder="Enter your password"/></div>
                                <button onKeyDown={e=>e.key==='Enter'&&!loading&&email&&password&&handleCreds()}
                                        onClick={handleCreds} disabled={!email||!password||loading}
                                        style={{width:'100%',padding:'13px',background:(!email||!password||loading)?'rgba(124,58,237,0.4)':'linear-gradient(135deg,#7c3aed,#9d5bff)',color:'white',border:'none',borderRadius:12,fontSize:15,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:8,cursor:(!email||!password||loading)?'not-allowed':'pointer',transition:'all 0.2s',marginTop:4}}>
                                    {loading?<><Spinner/> Verifying…</>:<>Continue →</>}
                                </button>
                                <button onClick={()=>setShowForgot(true)} style={{width:'100%',background:'none',border:'none',color:'var(--textm)',fontSize:12,cursor:'pointer',padding:'10px 0 0'}}>Forgot password?</button>
                            </div>
                        ):(
                            <div style={{padding:'2rem'}}>
                                <div style={{textAlign:'center',marginBottom:24}}>
                                    <div style={{fontSize:44,marginBottom:10,animation:'pulse-dot 1.5s infinite'}}>📱</div>
                                    <h3 style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:700,marginBottom:8}}>{pendingUser?.setup?'Set Up Two-Factor Authentication':'Two-Factor Verification'}</h3>
                                    {pendingUser?.setup?(
                                        <div>
                                            <p style={{fontSize:13,color:'var(--textm)',lineHeight:1.6}}>2FA is required for every account. Scan this QR code with an authenticator app (Google Authenticator, Microsoft Authenticator, Authy…), then enter the 6-digit code it shows.</p>
                                            {pendingUser.setup.qrCode&&<img src={pendingUser.setup.qrCode} alt="2FA QR code" style={{width:170,height:170,borderRadius:12,background:'white',padding:6,margin:'14px auto 8px',display:'block'}}/>}
                                            <p style={{fontSize:12,color:'var(--textl)'}}>Can't scan? Type this key: <code style={{color:'var(--cyan2)',wordBreak:'break-all'}}>{pendingUser.setup.secret}</code></p>
                                        </div>
                                    ):(
                                        <p style={{fontSize:13,color:'var(--textm)'}}>Enter the 6-digit code from your authenticator app</p>
                                    )}
                                    <p style={{fontSize:12,color:'var(--textl)',marginTop:4}}>Account: {pendingUser?.email}</p>
                                </div>
                                {err&&<div style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',color:'#f87171',padding:'10px 14px',borderRadius:10,fontSize:13,marginBottom:16,textAlign:'center'}}>{err}</div>}
                                <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:24}}>
                                    {[0,1,2,3,4,5].map(i=>(
                                        <input key={i} ref={el=>{refs.current[i]=el;}} inputMode="numeric" autoComplete="one-time-code"
                                               maxLength={1} value={code[i]||''}
                                               onChange={e=>handleOTPInput(i,e.target.value)}
                                               onKeyDown={e=>{if(e.key==='Backspace'&&!code[i]&&i>0)refs.current[i-1]?.focus();if(e.key==='Enter'&&code.length===6)handle2FA();}}
                                               style={{width:48,height:56,textAlign:'center',fontSize:24,fontWeight:700,background:'rgba(255,255,255,0.06)',border:`2px solid ${code[i]?'var(--purple)':'var(--border)'}`,borderRadius:12,color:'var(--text)',outline:'none',transition:'border-color 0.2s'}}/>
                                    ))}
                                </div>
                                <button onClick={handle2FA} disabled={code.length!==6||loading}
                                        style={{width:'100%',padding:'13px',background:code.length!==6?'rgba(16,185,129,0.3)':'linear-gradient(135deg,#059669,#10b981)',color:'white',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:code.length!==6?'not-allowed':'pointer',transition:'all 0.2s',marginBottom:12}}>
                                    {loading?'Verifying…':'✓ Verify & Sign In'}
                                </button>
                                <button onClick={()=>{setStep('creds');setCode('');setErr('');}} style={{width:'100%',background:'none',border:'none',color:'var(--textm)',fontSize:13,cursor:'pointer',padding:8}}>← Back</button>
                            </div>
                        )}
                    </div>
                    <div style={{textAlign:'center',marginTop:16,display:'flex',gap:4,justifyContent:'center',alignItems:'center'}}>
                        <span style={{fontSize:12,color:'var(--textl)'}}>New to CyberShield?</span>
                        <button onClick={()=>setShowRegister(true)} style={{background:'none',border:'none',color:'var(--purple2)',fontSize:12,fontWeight:600,cursor:'pointer',padding:0}}>Request Access →</button>
                    </div>
                    <p style={{textAlign:'center',fontSize:11,color:'var(--textl)',marginTop:8}}>Secure sign-in · Two-factor authentication</p>
                </div>
            </div>
        );
    }

    /* ─── CERTIFICATE VIEW ───────────────────── */
    function CertView({module,user,progress,onBack}){
        const cert=module.certTemplate||{};
        const dateStr=progress?.completedDate
            ?new Date(progress.completedDate).toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'})
            :new Date().toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'});

        // Draws the certificate onto a canvas and downloads it as a PNG picture.
        const [saving,setSaving]=useState(false);
        const download=async()=>{
            setSaving(true);
            try{
                if(document.fonts&&document.fonts.ready)await document.fonts.ready;
                const W=1600,H=1130,accent=cert.accentColor||module.color||'#7c3aed';
                const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
                const g=canvas.getContext('2d');
                // background
                const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#1e1e42');bg.addColorStop(1,'#0d0d1a');
                g.fillStyle=bg;g.fillRect(0,0,W,H);
                const glow=g.createRadialGradient(W/2,H/2,50,W/2,H/2,W*0.6);glow.addColorStop(0,accent+'33');glow.addColorStop(1,'rgba(0,0,0,0)');
                g.fillStyle=glow;g.fillRect(0,0,W,H);
                // borders
                g.strokeStyle=accent;g.lineWidth=10;g.strokeRect(40,40,W-80,H-80);
                g.strokeStyle=accent+'66';g.lineWidth=2;g.strokeRect(64,64,W-128,H-128);
                g.strokeStyle=accent+'99';g.lineWidth=3;
                [[90,90],[W-170,90],[90,H-170],[W-170,H-170]].forEach(([x,y])=>g.strokeRect(x,y,80,80));
                // text helper: centred, shrinks to fit the width
                const text=(str,y,size,weight,color,family,maxW=W-360)=>{
                    let fs=size;
                    do{g.font=`${weight} ${fs}px ${family}`;fs-=2;}while(g.measureText(str).width>maxW&&fs>14);
                    g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';g.fillText(str,W/2,y);
                };
                const display="Syne, 'Space Grotesk', Arial, sans-serif",body="'Space Grotesk', Arial, sans-serif";
                text(cert.badge||'🏆',215,110,'400','#ffffff',"'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif");
                g.save();g.font=`600 26px ${display}`;
                text('C Y B E R S H I E L D   P L A T F O R M',320,26,'600',accent,display);g.restore();
                text(cert.title||'Certificate of Completion',395,64,'800','#ffffff',display);
                g.fillStyle=accent;g.fillRect(W/2-70,450,140,5);
                text('This certifies that',520,30,'400','rgba(255,255,255,0.7)',body);
                g.shadowColor=accent;g.shadowBlur=30;
                text(user.name,610,84,'800','#ffffff',display);
                g.shadowBlur=0;
                text('has successfully completed',700,30,'400','rgba(255,255,255,0.7)',body);
                text(cert.subtitle||module.title,775,48,'700',accent,display);
                // footer: score | date | module
                g.strokeStyle=accent+'55';g.lineWidth=2;g.beginPath();g.moveTo(260,860);g.lineTo(W-260,860);g.stroke();
                const cols=[['Score',(progress?.score??100)+'%'],['Date',dateStr],['Module',module.title]];
                cols.forEach(([label,value],i)=>{
                    const x=W/2+(i-1)*400;
                    g.textAlign='center';g.textBaseline='middle';
                    g.fillStyle='#ffffff';g.font=`700 26px ${body}`;g.fillText(label,x,915);
                    let fs=26;do{g.font=`400 ${fs}px ${body}`;fs-=1;}while(g.measureText(value).width>360&&fs>12);
                    g.fillStyle='rgba(255,255,255,0.7)';g.fillText(value,x,960);
                    if(i<2){g.fillStyle='rgba(255,255,255,0.18)';g.fillRect(x+200,895,2,85);}
                });
                const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a');
                a.href=url;a.download=`${user.name.replace(/\s+/g,'_')}_${module.title.replace(/[^\w]+/g,'_')}_Certificate.png`;
                document.body.appendChild(a);a.click();a.remove();
                setTimeout(()=>URL.revokeObjectURL(url),1000);
            }finally{setSaving(false);}
        };

        return(
            <div style={{maxWidth:700,margin:'0 auto',padding:'2rem',animation:'slide-in 0.4s ease'}}>
                <button onClick={onBack} style={{background:'none',border:'none',color:'var(--textm)',cursor:'pointer',marginBottom:20,display:'flex',alignItems:'center',gap:6,fontSize:14}}>← Back</button>
                <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:20,textAlign:'center'}}>🏆 Your Certificate</h2>
                <div style={{background:'linear-gradient(135deg,#1e1e42,#0d0d1a)',border:`3px solid ${cert.accentColor||'#7c3aed'}`,borderRadius:24,padding:'3rem',textAlign:'center',position:'relative',overflow:'hidden',marginBottom:24,boxShadow:`0 0 60px ${cert.accentColor||'#7c3aed'}33`}}>
                    {/* Corner ornaments */}
                    {[[{top:12,left:12},{top:12,right:12},{bottom:12,left:12},{bottom:12,right:12}]].flat().map((pos,i)=>(
                        <div key={i} style={{position:'absolute',width:40,height:40,...pos,border:`2px solid ${cert.accentColor||'#7c3aed'}55`,borderRadius:4}}/>
                    ))}
                    <div style={{fontSize:56,marginBottom:12}}>{cert.badge||'🏆'}</div>
                    <div style={{fontFamily:'Syne,sans-serif',fontSize:11,letterSpacing:'0.3em',textTransform:'uppercase',color:cert.accentColor||'#7c3aed',marginBottom:8,fontWeight:600}}>CyberShield Platform</div>
                    <h1 style={{fontFamily:'Syne,sans-serif',fontSize:26,fontWeight:800,color:'white',marginBottom:6}}>{cert.title||'Certificate of Completion'}</h1>
                    <div style={{width:60,height:2,background:cert.accentColor||'#7c3aed',margin:'14px auto',borderRadius:2}}/>
                    <p style={{fontSize:14,color:'rgba(255,255,255,0.6)',marginBottom:6}}>This certifies that</p>
                    <h2 style={{fontFamily:'Syne,sans-serif',fontSize:34,fontWeight:800,color:'white',marginBottom:6,textShadow:`0 0 30px ${cert.accentColor||'#7c3aed'}88`}}>{user.name}</h2>
                    <p style={{fontSize:14,color:'rgba(255,255,255,0.6)',marginBottom:4}}>has successfully completed</p>
                    <h3 style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:700,color:cert.accentColor||'#7c3aed',marginBottom:24}}>{cert.subtitle||module.title}</h3>
                    <div style={{display:'flex',justifyContent:'center',gap:32,fontSize:13,borderTop:`1px solid ${cert.accentColor||'#7c3aed'}33`,paddingTop:20}}>
                        <div><div style={{fontWeight:700,color:'white',marginBottom:2}}>Score</div><div style={{color:'rgba(255,255,255,0.6)'}}>{progress?.score||100}%</div></div>
                        <div style={{width:1,background:'rgba(255,255,255,0.15)'}}/>
                        <div><div style={{fontWeight:700,color:'white',marginBottom:2}}>Date</div><div style={{color:'rgba(255,255,255,0.6)'}}>{dateStr}</div></div>
                        <div style={{width:1,background:'rgba(255,255,255,0.15)'}}/>
                        <div><div style={{fontWeight:700,color:'white',marginBottom:2}}>Module</div><div style={{color:'rgba(255,255,255,0.6)'}}>{module.title}</div></div>
                    </div>
                </div>
                <Btn onClick={download} disabled={saving} variant="success" style={{width:'100%',justifyContent:'center'}} size="lg">{saving?'Creating image…':'⬇️ Download Certificate (PNG)'}</Btn>
            </div>
        );
    }

    /* ─── MODULE PLAYER ──────────────────────── */
    /* The quiz is marked on the server: each answer is saved as soon as it is chosen,
       so the correct answers are never sent to the browser in advance. */
    function ModulePlayer({module,user,onBack,onComplete,add}){
        const [stage,setStage]=useState('intro'); // intro|video|quiz|result
        const [questions,setQuestions]=useState([]);
        const [attemptId,setAttemptId]=useState(null);
        const [currentQ,setCurrentQ]=useState(0);
        const [selected,setSelected]=useState(null);
        const [reveal,setReveal]=useState(null); // {correct,correctAnswer,explanation}
        const [showResult,setShowResult]=useState(false);
        const [showHint,setShowHint]=useState(false);
        const [hintTimer,setHintTimer]=useState(20);
        const [busy,setBusy]=useState(false);
        const [result,setResult]=useState(null);
        const timerRef=useRef(null);

        useEffect(()=>{
            if(stage!=='quiz'||showResult)return;
            setHintTimer(20);setShowHint(false);
            timerRef.current=setInterval(()=>{
                setHintTimer(t=>{
                    if(t<=1){clearInterval(timerRef.current);setShowHint(true);return 0;}
                    return t-1;
                });
            },1000);
            return()=>clearInterval(timerRef.current);
        },[currentQ,stage,showResult]);

        const q=questions[currentQ];
        const totalQ=questions.length||module.questionCount||0;

        const startQuiz=async()=>{
            setBusy(true);
            try{
                const data=await api.post('/api/learner/modules/'+module.id+'/attempts');
                setQuestions(data.questions);setAttemptId(data.attemptId);
                setCurrentQ(0);setSelected(null);setReveal(null);setShowResult(false);
                setStage('quiz');
            }catch(e){add(e.message,'err');}
            finally{setBusy(false);}
        };

        const handleAnswer=async opt=>{
            if(selected!==null||busy)return;
            clearInterval(timerRef.current);
            setSelected(opt);setBusy(true);
            try{
                const data=await api.post('/api/learner/attempts/'+attemptId+'/answers',{questionId:q.id,answer:opt});
                setReveal(data);setShowResult(true);
            }catch(e){add(e.message,'err');setSelected(null);}
            finally{setBusy(false);}
        };

        const nextQ=async()=>{
            if(currentQ<totalQ-1){
                setCurrentQ(x=>x+1);setSelected(null);setReveal(null);setShowResult(false);setShowHint(false);
                return;
            }
            setBusy(true);
            try{
                const data=await api.post('/api/learner/attempts/'+attemptId+'/finish');
                setResult(data);
                setStage('result');
                onComplete(data);
            }catch(e){add(e.message,'err');}
            finally{setBusy(false);}
        };

        if(stage==='intro')return(
            <div style={{maxWidth:680,margin:'0 auto',padding:'2.5rem 2rem',animation:'slide-in 0.4s ease'}}>
                <button onClick={onBack} style={{background:'none',border:'none',color:'var(--textm)',cursor:'pointer',marginBottom:20,display:'flex',alignItems:'center',gap:6,fontSize:14}}>← Back to Dashboard</button>
                <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:24,overflow:'hidden'}}>
                    <div style={{background:`linear-gradient(135deg,${module.color}44,${module.color}11)`,padding:'2.5rem',textAlign:'center'}}>
                        <div style={{fontSize:60,marginBottom:14,animation:'float 3s ease-in-out infinite'}}>{module.thumbnail}</div>
                        <h2 style={{fontFamily:'Syne,sans-serif',fontSize:26,fontWeight:800,marginBottom:8}}>{module.title}</h2>
                        <p style={{color:'var(--textm)',fontSize:14,maxWidth:400,margin:'0 auto',lineHeight:1.6}}>{module.desc}</p>
                    </div>
                    <div style={{padding:'2rem'}}>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:20}}>
                            {[['⏱',module.duration+' min','Duration'],['❓',module.questionCount+' Qs','Quiz'],['🏆',module.passingScore+'%','Pass mark for certificate']].map(([ic,v,l])=>(
                                <div key={l} style={{background:'rgba(255,255,255,0.04)',borderRadius:12,padding:'1rem',textAlign:'center'}}>
                                    <div style={{fontSize:22,marginBottom:4}}>{ic}</div>
                                    <div style={{fontWeight:700,fontSize:15}}>{v}</div>
                                    <div style={{fontSize:12,color:'var(--textm)'}}>{l}</div>
                                </div>
                            ))}
                        </div>
                        <div style={{background:'rgba(124,58,237,0.08)',border:'1px solid rgba(124,58,237,0.2)',borderRadius:12,padding:'12px 16px',marginBottom:20,fontSize:13,color:'var(--purple3)'}}>
                            💡 If you spend more than 20 seconds on a question, a <strong>magic hint</strong> will automatically appear!
                        </div>
                        <Btn onClick={()=>setStage('video')} style={{width:'100%',justifyContent:'center'}} size="lg">🚀 Start Module</Btn>
                    </div>
                </div>
            </div>
        );

        if(stage==='video')return(
            <div style={{maxWidth:680,margin:'0 auto',padding:'2.5rem 2rem',animation:'slide-in 0.4s ease'}}>
                <button onClick={()=>setStage('intro')} style={{background:'none',border:'none',color:'var(--textm)',cursor:'pointer',marginBottom:20,display:'flex',alignItems:'center',gap:6,fontSize:14}}>← Back</button>
                <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:24,overflow:'hidden'}}>
                    <div style={{padding:'1.5rem 2rem',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12}}>
                        <span style={{fontSize:24}}>{module.thumbnail}</span>
                        <div>
                            <div style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:700}}>{module.title}</div>
                            <div style={{fontSize:12,color:'var(--textm)'}}>Training Content</div>
                        </div>
                    </div>
                    <div style={{padding:'2rem'}}>
                        {module.videoUrl?(
                            <VideoPlayer url={module.videoUrl} style={{marginBottom:20}}/>
                        ):(
                            <div style={{background:'rgba(0,0,0,0.4)',borderRadius:16,aspectRatio:'16/9',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',marginBottom:20,border:`2px dashed ${module.color}44`}}>
                                <div style={{fontSize:52,marginBottom:12,animation:'pulse-dot 2s infinite'}}>{module.thumbnail}</div>
                                <div style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:700,marginBottom:8}}>{module.title}</div>
                                <div style={{fontSize:13,color:'var(--textm)',textAlign:'center',maxWidth:320,lineHeight:1.6,padding:'0 20px'}}>{module.desc}</div>
                                <div style={{fontSize:12,color:'var(--textl)',marginTop:16}}>📹 No video uploaded for this module yet</div>
                            </div>
                        )}
                        {module.videoName&&<div style={{fontSize:12,color:'var(--textm)',marginBottom:16,textAlign:'center'}}>📹 {module.videoName}</div>}
                        {module.content&&(
                            <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:14,padding:'1.25rem 1.5rem',marginBottom:20,fontSize:14,lineHeight:1.75,color:'var(--text)',whiteSpace:'pre-wrap'}}>{module.content}</div>
                        )}
                        <Btn onClick={startQuiz} disabled={busy||!module.questionCount} style={{width:'100%',justifyContent:'center'}} size="lg">{busy?<><Spinner/> Loading quiz…</>:'📝 Take the Quiz'}</Btn>
                    </div>
                </div>
            </div>
        );

        if(stage==='quiz'&&q){
            const pct=Math.round((currentQ/totalQ)*100);
            const correctIdx=reveal?reveal.correctAnswer:null;
            return(
                <div style={{maxWidth:680,margin:'0 auto',padding:'2.5rem 2rem',animation:'slide-in 0.4s ease'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                        <div style={{fontSize:14,color:'var(--textm)'}}>Question {currentQ+1} / {totalQ}</div>
                        {!showResult&&!showHint&&(
                            <div style={{background:hintTimer<=5?'rgba(239,68,68,0.15)':'rgba(245,158,11,0.12)',border:`1px solid ${hintTimer<=5?'rgba(239,68,68,0.5)':'rgba(245,158,11,0.4)'}`,borderRadius:8,padding:'5px 14px',fontSize:13,fontWeight:700,color:hintTimer<=5?'#f87171':'#fbbf24',minWidth:70,textAlign:'center'}}>
                                ⏱ {hintTimer}s
                            </div>
                        )}
                    </div>
                    <PBar value={pct} color={module.color} height={5}/>
                    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:24,overflow:'hidden',marginTop:16}}>
                        <div style={{background:`linear-gradient(135deg,${module.color}22,transparent)`,padding:'2rem',borderBottom:'1px solid var(--border)'}}>
                            <div style={{display:'inline-block',background:`${module.color}33`,border:`1px solid ${module.color}55`,borderRadius:8,padding:'4px 12px',fontSize:12,fontWeight:700,color:module.color,marginBottom:12}}>Q{currentQ+1}</div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontSize:18,fontWeight:700,lineHeight:1.45}}>{q.q}</h3>
                        </div>
                        <div style={{padding:'2rem'}}>
                            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:18}}>
                                {q.options.map((opt,i)=>{
                                    let bg='rgba(255,255,255,0.04)',bdr='var(--border)',col='var(--text)';
                                    if(reveal){
                                        if(i===correctIdx){bg='rgba(16,185,129,0.12)';bdr='#10b981';col='#34d399';}
                                        else if(i===selected&&selected!==correctIdx){bg='rgba(239,68,68,0.12)';bdr='#ef4444';col='#f87171';}
                                    }else if(i===selected){bdr='var(--purple)';}
                                    return(
                                        <button key={i} onClick={()=>handleAnswer(i)} disabled={selected!==null}
                                                style={{background:bg,border:`1.5px solid ${bdr}`,borderRadius:12,padding:'13px 18px',fontSize:14,color:col,textAlign:'left',cursor:selected!==null?'default':'pointer',transition:'all 0.2s',display:'flex',alignItems:'center',gap:12}}>
                                            <div style={{width:28,height:28,borderRadius:'50%',background:`${bdr}22`,border:`1.5px solid ${bdr}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0,color:col}}>{String.fromCharCode(65+i)}</div>
                                            {opt}
                                            {reveal&&i===correctIdx&&<span style={{marginLeft:'auto'}}>✓</span>}
                                            {reveal&&i===selected&&selected!==correctIdx&&<span style={{marginLeft:'auto'}}>✗</span>}
                                        </button>
                                    );
                                })}
                            </div>
                            {showHint&&!showResult&&q.hint&&(
                                <div style={{background:'linear-gradient(135deg,rgba(124,58,237,0.2),rgba(6,182,212,0.2))',border:'1px solid rgba(124,58,237,0.4)',borderRadius:14,padding:'14px 18px',marginBottom:16,animation:'hint-appear 0.5s cubic-bezier(0.34,1.56,0.64,1)'}}>
                                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                                        <span style={{fontSize:18}}>✨</span>
                                        <span style={{fontWeight:700,color:'var(--purple3)',fontSize:13}}>Magic Hint</span>
                                    </div>
                                    <p style={{fontSize:13,color:'var(--textm)',lineHeight:1.6}}>{q.hint}</p>
                                </div>
                            )}
                            {showResult&&reveal&&(
                                <div>
                                    <div style={{background:reveal.correct?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)',border:`1px solid ${reveal.correct?'#10b981':'#ef4444'}`,borderRadius:12,padding:'12px 16px',marginBottom:14,fontSize:14,color:reveal.correct?'#34d399':'#f87171'}}>
                                        {reveal.correct?'🎉 Correct!':'❌ Incorrect — correct answer is highlighted in green'}
                                        {reveal.explanation&&<div style={{fontSize:13,color:'var(--textm)',marginTop:6}}>{reveal.explanation}</div>}
                                    </div>
                                    <Btn onClick={nextQ} disabled={busy} style={{width:'100%',justifyContent:'center'}} size="lg">{busy?<><Spinner/> Saving…</>:currentQ<totalQ-1?'Next →':'View Results 🏆'}</Btn>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        if(stage==='result'&&result){
            const sc=result.score;
            return(
                <div style={{maxWidth:560,margin:'0 auto',padding:'3rem 2rem',textAlign:'center',animation:'slide-in 0.4s ease'}}>
                    <div style={{fontSize:72,marginBottom:14,animation:'badge-pop 0.6s cubic-bezier(0.34,1.56,0.64,1)'}}>{result.passed?'🏆':sc>=result.passingScore/2?'👍':'📚'}</div>
                    <h2 style={{fontFamily:'Syne,sans-serif',fontSize:26,fontWeight:800,marginBottom:8}}>{result.passed?'Excellent Work!':'Keep Learning!'}</h2>
                    <p style={{color:'var(--textm)',marginBottom:24}}>You finished <strong>{module.title}</strong> — {result.correctAnswers} of {result.totalQuestions} correct</p>
                    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,padding:'2rem',marginBottom:24}}>
                        <div style={{fontFamily:'Syne,sans-serif',fontSize:56,fontWeight:800,background:result.passed?'linear-gradient(135deg,#10b981,#06b6d4)':'linear-gradient(135deg,#ef4444,#f87171)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text',marginBottom:8}}>{sc}%</div>
                        <PBar value={sc} color={result.passed?'#10b981':'#ef4444'} height={12}/>
                        {result.passed
                            ?<p style={{marginTop:14,color:'#34d399',fontSize:14}}>🎉 Passed! Your certificate is ready.</p>
                            :<p style={{marginTop:14,color:'#f87171',fontSize:14}}>You need {result.passingScore}% to pass. Review the content and try again.</p>}
                    </div>
                    <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
                        {!result.passed&&<Btn onClick={()=>setStage('video')} variant="secondary">↺ Review & Retry</Btn>}
                        <button onClick={onBack} style={{background:'rgba(255,255,255,0.06)',border:'1px solid var(--border)',color:'var(--text)',padding:'12px 28px',borderRadius:12,fontSize:14,fontWeight:600,cursor:'pointer'}}>← Back to Dashboard</button>
                    </div>
                </div>
            );
        }

        return null;
    }

    /* ─── USER DASHBOARD ─────────────────────── */
    function UserDashboard({user,onLogout}){
        const [view,setView]=useState('home'); // home|module|cert|modules|certs|profile
        const [activeModule,setActiveModule]=useState(null);
        const [modules,setModules]=useState([]);
        const [loadingModules,setLoadingModules]=useState(true);
        const [userData,setUserData]=useState(user);
        const [notifOpen,setNotifOpen]=useState(false);
        const [profileOpen,setProfileOpen]=useState(false);
        const {toasts,add,remove}=useToast();

        // Load modules (with my progress) and my profile from the server.
        const refresh=async()=>{
            try{
                const [mods,profile]=await Promise.all([api.get('/api/learner/modules'),api.get('/api/me/profile')]);
                setModules(mods);
                setUserData(u=>({...u,...profile,avatar:initialsOf(profile.name)}));
                setActiveModule(a=>a?(mods.find(m=>m.id===a.id)||a):a);
            }catch(e){add(e.message,'err');}
            finally{setLoadingModules(false);}
        };

        useEffect(()=>{refresh();},[]);

        const progressOf=m=>m.progress||{};

        const notifications=useMemo(()=>{
            const n=[];
            modules.forEach(m=>{
                if(!m.dueDate)return;
                const due=new Date(m.dueDate);const today=new Date();
                const diff=Math.ceil((due-today)/(1000*60*60*24));
                const prog=progressOf(m);
                if(!prog?.completed&&diff<=7&&diff>0)n.push({id:m.id,msg:`"${m.title}" is due in ${diff} day${diff===1?'':'s'}`,type:'warn',moduleId:m.id});
                if(!prog?.completed&&diff<=0)n.push({id:m.id+'_od',msg:`"${m.title}" is overdue!`,type:'err',moduleId:m.id});
            });
            return n;
        },[modules,userData]);

        const completedMods=modules.filter(m=>progressOf(m).completed);
        const inProgressMods=modules.filter(m=>progressOf(m).started&&!progressOf(m).completed);
        const overdueMods=modules.filter(m=>{
            if(!m.dueDate||progressOf(m).completed)return false;
            return new Date(m.dueDate+'T23:59:59')<new Date();
        });
        const overallPct=modules.length?Math.round(completedMods.length/modules.length*100):0;

        const goToModule=async(m,restart=false)=>{
            if(restart){
                try{await api.post('/api/learner/modules/'+m.id+'/restart');await refresh();}
                catch(e){add(e.message,'err');return;}
            }
            setActiveModule(m);setView('module');
        };

        const NavBar=()=>(
            <div style={{background:'var(--bg2)',borderBottom:'1px solid var(--border)',padding:'0 2rem',display:'flex',alignItems:'center',justifyContent:'space-between',height:64,position:'sticky',top:0,zIndex:100}}>
                <div style={{display:'flex',alignItems:'center',gap:20}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}} onClick={()=>setView('home')}>
                        <span style={{fontSize:22}}>🛡️</span>
                        <span style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:800,background:'linear-gradient(135deg,#7c3aed,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>CyberShield</span>
                    </div>
                    {[['🏠 Home','home'],['📚 Modules','modules'],['🏆 Certificates','certs']].map(([l,v])=>(
                        <button key={v} onClick={()=>setView(v)} style={{background:view===v?'rgba(124,58,237,0.15)':'none',border:'none',color:view===v?'var(--purple2)':'var(--textm)',fontSize:13,fontWeight:view===v?600:400,padding:'6px 12px',borderRadius:8,cursor:'pointer'}}>
                            {l}
                        </button>
                    ))}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:12,position:'relative'}}>
                    {/* Notification bell */}
                    <div style={{position:'relative'}}>
                        <button onClick={()=>setNotifOpen(o=>!o)} style={{background:'rgba(255,255,255,0.06)',border:'1px solid var(--border)',borderRadius:10,width:38,height:38,fontSize:17,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',cursor:'pointer'}}>
                            🔔
                            {notifications.length>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'white',width:17,height:17,borderRadius:'50%',fontSize:9,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{notifications.length}</span>}
                        </button>
                        {notifOpen&&(
                            <div style={{position:'absolute',top:46,right:0,width:300,background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'0 8px 32px rgba(0,0,0,0.4)',zIndex:200,overflow:'hidden',animation:'fade-in 0.2s ease'}}>
                                <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',fontSize:13,fontWeight:700,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                    Notifications <button onClick={()=>setNotifOpen(false)} style={{background:'none',border:'none',color:'var(--textm)',cursor:'pointer',fontSize:16}}>✕</button>
                                </div>
                                {notifications.length===0
                                    ?<div style={{padding:'1.5rem',textAlign:'center',color:'var(--textm)',fontSize:13}}>All caught up! ✓</div>
                                    :notifications.map(n=>(
                                        <div key={n.id} onClick={()=>{const m=modules.find(x=>x.id===n.moduleId);if(m){goToModule(m);setNotifOpen(false);}}}
                                             style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',fontSize:13,color:n.type==='err'?'#f87171':'#fbbf24',cursor:'pointer',background:'rgba(255,255,255,0.02)',display:'flex',alignItems:'flex-start',gap:8}}
                                             onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'}
                                             onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.02)'}>
                                            <span>{n.type==='err'?'⚠️':'📅'}</span>
                                            <span>{n.msg} — <strong>Click to open</strong></span>
                                        </div>
                                    ))}
                            </div>
                        )}
                    </div>
                    {/* Profile button */}
                    <div style={{position:'relative'}}>
                        <div onClick={()=>setProfileOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,background:'rgba(255,255,255,0.06)',border:'1px solid var(--border)',borderRadius:10,padding:'6px 12px',cursor:'pointer'}}>
                            {userData.photo
                                ?<img src={userData.photo} style={{width:28,height:28,borderRadius:'50%',objectFit:'cover',border:'2px solid #7c3aed55'}}/>
                                :<Ava initials={userData.avatar||userData.name.slice(0,2).toUpperCase()} color={userData.color||'#7c3aed'} size={28}/>
                            }
                            <span style={{fontSize:13,fontWeight:600,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{userData.name.split(' ')[0]}</span>
                            <span style={{color:'var(--textm)',fontSize:11}}>▾</span>
                        </div>
                        {profileOpen&&(
                            <div style={{position:'absolute',top:46,right:0,width:200,background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'0 8px 32px rgba(0,0,0,0.4)',zIndex:200,overflow:'hidden',animation:'fade-in 0.2s ease'}}>
                                <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
                                    <div style={{fontSize:14,fontWeight:600}}>{userData.name}</div>
                                    <div style={{fontSize:11,color:'var(--textm)'}}>{userData.email}</div>
                                </div>
                                <div onClick={()=>{setProfileOpen(false);setView('profile');}} style={{padding:'11px 16px',fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',gap:8,color:'var(--text)'}}
                                     onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'}
                                     onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                    👤 My Profile
                                </div>
                                <div style={{height:1,background:'var(--border)'}}/>
                                <div onClick={onLogout} style={{padding:'11px 16px',fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',gap:8,color:'#f87171'}}
                                     onMouseEnter={e=>e.currentTarget.style.background='rgba(239,68,68,0.08)'}
                                     onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                    🚪 Sign Out
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );

        /* ── MODULE CARD ── */
        const ModuleCard=({m,compact=false})=>{
            const prog=progressOf(m);
            const due=m.dueDate?new Date(m.dueDate+'T23:59:59'):null;
            const today=new Date();
            const overdue=due&&due<today&&!prog.completed;
            const dueSoon=due&&Math.ceil((due-today)/(1000*60*60*24))<=3&&!prog.completed&&!overdue;
            const progPct=prog.completed?100:prog.started?(prog.progressPercentage||0):0;
            return(
                <div style={{background:'var(--card)',border:`1px solid ${prog.completed?m.color+'44':'var(--border)'}`,borderRadius:20,overflow:'hidden',transition:'transform 0.2s,box-shadow 0.2s',cursor:'pointer',boxShadow:prog.completed?`0 0 20px ${m.color}22`:'none'}}
                     onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow=`0 12px 32px ${m.color}33`;}}
                     onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow=prog.completed?`0 0 20px ${m.color}22`:'none';}}>
                    <div style={{background:`linear-gradient(135deg,${m.color}44,${m.color}11)`,padding:'1.5rem',borderBottom:'1px solid var(--border)'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                            <span style={{fontSize:36}}>{m.thumbnail}</span>
                            <div style={{display:'flex',flexDirection:'column',gap:4,alignItems:'flex-end'}}>
                                {prog.completed&&<Badge color='#10b981'>✓ Done</Badge>}
                                {prog.started&&!prog.completed&&<Badge color='#06b6d4'>In Progress</Badge>}
                                {overdue&&<Badge color='#ef4444'>Overdue</Badge>}
                                {dueSoon&&<Badge color='#f59e0b'>Due Soon</Badge>}
                                {!prog.started&&!overdue&&!dueSoon&&<Badge color={m.color}>{m.category}</Badge>}
                            </div>
                        </div>
                        <h4 style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:700,marginBottom:4}}>{m.title}</h4>
                        {!compact&&<p style={{fontSize:12,color:'var(--textm)',lineHeight:1.5}}>{m.desc}</p>}
                    </div>
                    <div style={{padding:'1.25rem 1.5rem'}}>
                        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--textm)',marginBottom:10}}>
                            <span>⏱ {m.duration} min</span>
                            {m.dueDate&&<span style={{color:overdue?'#f87171':dueSoon?'#fbbf24':'var(--textm)'}}>📅 {new Date(m.dueDate).toLocaleDateString()}</span>}
                        </div>
                        {prog.started&&<div style={{marginBottom:12}}><PBar value={progPct} color={m.color} height={5}/></div>}
                        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                            <Btn onClick={()=>goToModule(m)} style={{flex:1,justifyContent:'center',background:`linear-gradient(135deg,${m.color},${m.color}99)`}} size="sm">
                                {prog.completed?'Review':'Start'}
                            </Btn>
                            {prog.completed&&(
                                <>
                                    <Btn onClick={()=>{setActiveModule(m);setView('cert');}} variant="ghost" size="sm">🏆 Cert</Btn>
                                    <Btn onClick={()=>goToModule(m,true)} variant="danger" size="sm">↺ Restart</Btn>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        /* ── HOME VIEW ── */
        if(view==='home')return(
            <div style={{minHeight:'100vh',background:'var(--bg)'}}>
                <Toast toasts={toasts} remove={remove}/>
                <NavBar/>
                <div style={{maxWidth:1100,margin:'0 auto',padding:'2rem'}}>
                    {/* Overdue banner */}
                    {overdueMods.length>0&&(
                        <div style={{background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:14,padding:'14px 20px',marginBottom:24,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
                            <div style={{display:'flex',alignItems:'center',gap:10}}>
                                <span style={{fontSize:20}}>⚠️</span>
                                <div>
                                    <div style={{fontWeight:600,fontSize:14,color:'#f87171'}}>You have {overdueMods.length} overdue module{overdueMods.length>1?'s':''}</div>
                                    <div style={{fontSize:12,color:'var(--textm)'}}>Click to go to your overdue modules</div>
                                </div>
                            </div>
                            <Btn variant="danger" size="sm" onClick={()=>setView('modules')}>View Overdue →</Btn>
                        </div>
                    )}
                    <div style={{marginBottom:24}}>
                        <h2 style={{fontFamily:'Syne,sans-serif',fontSize:24,fontWeight:800,marginBottom:4}}>Welcome back, {userData.name.split(' ')[0]}! 👋</h2>
                        <p style={{color:'var(--textm)',fontSize:14}}>Continue your cybersecurity training journey</p>
                    </div>
                    {/* Stats */}
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:14,marginBottom:28}}>
                        {[
                            {icon:'📚',l:'Modules Available',v:modules.length,c:'#7c3aed',g:'linear-gradient(135deg,#7c3aed22,#06b6d422)',click:()=>setView('modules')},
                            {icon:'✅',l:'Completed',v:completedMods.length,c:'#10b981',g:'linear-gradient(135deg,#10b98122,#06b6d422)',click:()=>setView('modules')},
                            {icon:'🎯',l:'Overall Progress',v:overallPct+'%',c:'#06b6d4',g:'linear-gradient(135deg,#06b6d422,#7c3aed22)',click:null},
                            {icon:'🏆',l:'Certificates',v:completedMods.length,c:'#f59e0b',g:'linear-gradient(135deg,#f59e0b22,#ec489922)',click:()=>setView('certs')},
                        ].map(s=>(
                            <div key={s.l} onClick={s.click||undefined} style={{background:s.g,border:`1px solid ${s.c}33`,borderRadius:16,padding:'1.5rem',cursor:s.click?'pointer':'default',transition:'transform 0.2s'}}
                                 onMouseEnter={e=>{if(s.click)e.currentTarget.style.transform='translateY(-2px)'}}
                                 onMouseLeave={e=>{e.currentTarget.style.transform=''}}>
                                <div style={{fontSize:28,marginBottom:8}}>{s.icon}</div>
                                <div style={{fontFamily:'Syne,sans-serif',fontSize:28,fontWeight:800,color:s.c}}>{s.v}</div>
                                <div style={{fontSize:13,color:'var(--textm)',marginTop:2}}>{s.l}</div>
                            </div>
                        ))}
                    </div>
                    {/* Overall progress bar */}
                    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:'1.5rem',marginBottom:28}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                            <span style={{fontWeight:600,fontSize:14}}>Overall Completion</span>
                            <span style={{color:'var(--cyan2)',fontWeight:700,fontFamily:'Syne,sans-serif',fontSize:18}}>{overallPct}%</span>
                        </div>
                        <PBar value={overallPct} color='#06b6d4' height={10}/>
                        <div style={{fontSize:12,color:'var(--textm)',marginTop:8}}>{completedMods.length} of {modules.length} modules completed</div>
                    </div>
                    {/* Continue / Start modules */}
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                        <h3 style={{fontFamily:'Syne,sans-serif',fontSize:17,fontWeight:700}}>{inProgressMods.length>0?'Continue Training':'Available Modules'}</h3>
                        <button onClick={()=>setView('modules')} style={{background:'none',border:'none',color:'var(--purple2)',fontSize:13,cursor:'pointer',fontWeight:600}}>View All →</button>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
                        {(inProgressMods.length>0?inProgressMods:modules).slice(0,3).map(m=><ModuleCard key={m.id} m={m}/>)}
                    </div>
                </div>
            </div>
        );

        /* ── MODULE PLAYER VIEW ── */
        if(view==='module'&&activeModule)return(
            <div style={{minHeight:'100vh',background:'var(--bg)'}}>
                <Toast toasts={toasts} remove={remove}/>
                <NavBar/>
                <ModulePlayer module={activeModule} user={userData}
                              onBack={()=>{setView('home');setActiveModule(null);refresh();}}
                              onComplete={(result)=>{
                                  refresh();
                                  if(result.passed){
                                      add('🎉 Module completed! Certificate ready.','ok');
                                      setTimeout(()=>{setView('cert');},1500);
                                  }else add('Quiz saved. You need '+result.passingScore+'% to pass.','warn');
                              }}
                              add={add}/>
            </div>
        );

        /* ── CERT VIEW ── */
        if(view==='cert'&&activeModule)return(
            <div style={{minHeight:'100vh',background:'var(--bg)'}}>
                <Toast toasts={toasts} remove={remove}/>
                <NavBar/>
                <CertView module={activeModule} user={userData} progress={progressOf(activeModule)} onBack={()=>{setView('home');setActiveModule(null);}}/>
            </div>
        );

        /* ── ALL MODULES VIEW ── */
        if(view==='modules')return(
            <div style={{minHeight:'100vh',background:'var(--bg)'}}>
                <Toast toasts={toasts} remove={remove}/>
                <NavBar/>
                <div style={{maxWidth:1100,margin:'0 auto',padding:'2rem'}}>
                    <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:4}}>Training Modules</h2>
                    <p style={{color:'var(--textm)',marginBottom:24}}>All available cybersecurity modules</p>
                    {overdueMods.length>0&&(
                        <div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontSize:15,fontWeight:700,color:'#f87171',marginBottom:12}}>⚠️ Overdue ({overdueMods.length})</h3>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14,marginBottom:28}}>
                                {overdueMods.map(m=><ModuleCard key={m.id} m={m}/>)}
                            </div>
                        </div>
                    )}
                    {inProgressMods.length>0&&(
                        <div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontSize:15,fontWeight:700,color:'var(--cyan2)',marginBottom:12}}>🔄 In Progress ({inProgressMods.length})</h3>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14,marginBottom:28}}>
                                {inProgressMods.map(m=><ModuleCard key={m.id} m={m}/>)}
                            </div>
                        </div>
                    )}
                    {completedMods.length>0&&(
                        <div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontSize:15,fontWeight:700,color:'var(--green2)',marginBottom:12}}>✅ Completed ({completedMods.length})</h3>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14,marginBottom:28}}>
                                {completedMods.map(m=><ModuleCard key={m.id} m={m}/>)}
                            </div>
                        </div>
                    )}
                    {loadingModules&&<div style={{padding:'2rem',textAlign:'center',color:'var(--textm)'}}>Loading modules…</div>}
                    {!loadingModules&&modules.length===0&&<div style={{padding:'2rem',textAlign:'center',color:'var(--textm)'}}>No training modules have been published yet.</div>}
                    {modules.filter(m=>!progressOf(m).started&&!overdueMods.includes(m)).length>0&&(
                        <div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontSize:15,fontWeight:700,color:'var(--textm)',marginBottom:12}}>📚 Not Started</h3>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
                                {modules.filter(m=>!progressOf(m).started&&!overdueMods.includes(m)).map(m=><ModuleCard key={m.id} m={m}/>)}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );

        /* ── CERTS VIEW ── */
        if(view==='certs')return(
            <div style={{minHeight:'100vh',background:'var(--bg)'}}>
                <Toast toasts={toasts} remove={remove}/>
                <NavBar/>
                <div style={{maxWidth:1100,margin:'0 auto',padding:'2rem'}}>
                    <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:4}}>My Certificates</h2>
                    <p style={{color:'var(--textm)',marginBottom:24}}>Certificates earned from completed modules</p>
                    {completedMods.length===0
                        ?<div style={{textAlign:'center',padding:'4rem',color:'var(--textm)'}}>
                            <div style={{fontSize:48,marginBottom:12}}>🏆</div>
                            <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>No certificates yet</div>
                            <p style={{fontSize:13}}>Complete a module to earn your first certificate</p>
                            <Btn onClick={()=>setView('modules')} style={{marginTop:16}}>Browse Modules</Btn>
                        </div>
                        :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:16}}>
                            {completedMods.map(m=>{
                                const prog=progressOf(m);
                                const cert=m.certTemplate||{};
                                return(
                                    <div key={m.id} style={{background:'linear-gradient(135deg,#1e1e42,#0d0d1a)',border:`2px solid ${cert.accentColor||m.color}`,borderRadius:18,overflow:'hidden',cursor:'pointer',transition:'transform 0.2s,box-shadow 0.2s',boxShadow:`0 0 20px ${cert.accentColor||m.color}22`}}
                                         onClick={()=>{setActiveModule(m);setView('cert');}}
                                         onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-4px)';e.currentTarget.style.boxShadow=`0 16px 40px ${cert.accentColor||m.color}44`;}}
                                         onMouseLeave={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow=`0 0 20px ${cert.accentColor||m.color}22`;}}>
                                        <div style={{padding:'2rem',textAlign:'center',borderBottom:`1px solid ${cert.accentColor||m.color}33`}}>
                                            <div style={{fontSize:40,marginBottom:8}}>{cert.badge||'🏆'}</div>
                                            <div style={{fontFamily:'Syne,sans-serif',fontSize:14,fontWeight:700,color:'white'}}>{cert.title||'Certificate of Completion'}</div>
                                            <div style={{fontSize:12,color:cert.accentColor||m.color,marginTop:4}}>{cert.subtitle||m.title}</div>
                                        </div>
                                        <div style={{padding:'1rem 1.5rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                            <div>
                                                <div style={{fontSize:11,color:'var(--textl)'}}>Score</div>
                                                <div style={{fontSize:14,fontWeight:700,color:'var(--green2)'}}>{prog?.score||100}%</div>
                                            </div>
                                            <div style={{textAlign:'right'}}>
                                                <div style={{fontSize:11,color:'var(--textl)'}}>Completed</div>
                                                <div style={{fontSize:12,color:'var(--textm)'}}>{prog?.completedDate?new Date(prog.completedDate).toLocaleDateString():'-'}</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    }
                </div>
            </div>
        );

        /* ── PROFILE VIEW ── */
        if(view==='profile')return(
            <div style={{minHeight:'100vh',background:'var(--bg)'}}>
                <Toast toasts={toasts} remove={remove}/>
                <NavBar/>
                <ProfileEditor userData={userData} completedMods={completedMods} inProgressMods={inProgressMods} modules={modules}
                               onBack={()=>setView('home')}
                               onSaved={profile=>{setUserData(u=>({...u,...profile,avatar:initialsOf(profile.name)}));add('Profile updated!','ok');}}
                               add={add}/>
            </div>
        );

        return null;
    }

    /* ─── TWO-FACTOR AUTHENTICATION PANEL ───── */
    /* Used on the learner profile page and in the owner/admin "Security" window. */
    function TwoFactorPanel({enabled,required,onChange,add}){
        const [setup,setSetup]=useState(null); // {qrCode,secret}
        const [code,setCode]=useState('');
        const [busy,setBusy]=useState(false);
        const [disabling,setDisabling]=useState(false);

        const start=async()=>{
            setBusy(true);
            try{setSetup(await api.post('/api/me/2fa/setup'));setCode('');}
            catch(e){add(e.message,'err');}
            finally{setBusy(false);}
        };
        const confirm=async()=>{
            setBusy(true);
            try{
                const profile=await api.post('/api/me/2fa/enable',{code});
