                setSetup(null);setCode('');onChange(profile);add('Two-factor authentication is now on.','ok');
            }catch(e){add(e.message,'err');}
            finally{setBusy(false);}
        };
        const turnOff=async()=>{
            setBusy(true);
            try{
                const profile=await api.post('/api/me/2fa/disable',{code});
                setDisabling(false);setCode('');onChange(profile);add('Two-factor authentication turned off.','warn');
            }catch(e){add(e.message,'err');}
            finally{setBusy(false);}
        };
        const codeInput=(
            <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,'').slice(0,6))} placeholder="6-digit code" inputMode="numeric"
                   style={{width:140,padding:'10px 12px',background:'rgba(255,255,255,0.05)',border:'1.5px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:16,letterSpacing:'0.2em',textAlign:'center',outline:'none'}}/>
        );

        return(
            <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:14,padding:'1.25rem'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
                    <div>
                        <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>🔐 Two-Factor Authentication</div>
                        <div style={{fontSize:12,color:'var(--textm)'}}>Use an authenticator app (Google Authenticator, Microsoft Authenticator, Authy…) when signing in.</div>
                    </div>
                    <Badge color={enabled?'#10b981':'#64748b'}>{enabled?'Enabled':'Off'}</Badge>
                </div>
                {!enabled&&!setup&&<Btn onClick={start} disabled={busy} variant="secondary" size="sm" style={{marginTop:14}}>Set up 2FA</Btn>}
                {!enabled&&setup&&(
                    <div style={{marginTop:14,display:'flex',gap:18,alignItems:'center',flexWrap:'wrap'}}>
                        <img src={setup.qrCode} alt="2FA QR code" style={{width:160,height:160,borderRadius:12,background:'white',padding:6}}/>
                        <div style={{flex:1,minWidth:200}}>
                            <ol style={{fontSize:13,color:'var(--textm)',lineHeight:1.7,paddingLeft:18,marginBottom:10}}>
                                <li>Scan the QR code with your authenticator app.</li>
                                <li>Or type this key: <code style={{color:'var(--cyan2)',wordBreak:'break-all'}}>{setup.secret}</code></li>
                                <li>Enter the 6-digit code it shows.</li>
                            </ol>
                            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                                {codeInput}
                                <Btn onClick={confirm} disabled={busy||code.length!==6} variant="success" size="sm">Turn on</Btn>
                                <Btn onClick={()=>{setSetup(null);setCode('');}} variant="ghost" size="sm">Cancel</Btn>
                            </div>
                        </div>
                    </div>
                )}
                {enabled&&required&&<div style={{fontSize:12,color:'var(--textl)',marginTop:12}}>2FA is required for every account. If you lose your phone, ask an administrator to reset it.</div>}
                {enabled&&!required&&!disabling&&<Btn onClick={()=>{setDisabling(true);setCode('');}} variant="danger" size="sm" style={{marginTop:14}}>Turn off 2FA</Btn>}
                {enabled&&disabling&&(
                    <div style={{marginTop:14,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                        <span style={{fontSize:13,color:'var(--textm)'}}>Enter a current code to confirm:</span>
                        {codeInput}
                        <Btn onClick={turnOff} disabled={busy||code.length!==6} variant="danger" size="sm">Turn off</Btn>
                        <Btn onClick={()=>setDisabling(false)} variant="ghost" size="sm">Cancel</Btn>
                    </div>
                )}
            </div>
        );
    }

    function OwnerDashboard({owner,onLogout}){
        const [tab,setTab]=useState('overview');
        const [modules,setModules]=useState([]);
        const [learners,setLearners]=useState([]);
        const [loading,setLoading]=useState(true);
        const [editingModule,setEditingModule]=useState(null);
        const [editType,setEditType]=useState(null); // 'info'|'video'|'quiz'|'cert'
        const [showAdd,setShowAdd]=useState(false);
        const [confirm,setConfirm]=useState(null);
        const [showSecurity,setShowSecurity]=useState(false);
        const {toasts,add,remove}=useToast();

        const load=async()=>{
            try{
                const [mods,people]=await Promise.all([api.get('/api/owner/modules'),api.get('/api/owner/learners')]);
                setModules(mods);setLearners(people);
            }catch(e){add(e.message,'err');}
            finally{setLoading(false);}
        };
        useEffect(()=>{load();},[]);

        // Replace one module in the list with the version the server returned.
        const replaceModule=updated=>setModules(ms=>ms.map(m=>m.id===updated.id?updated:m));
        const closeEditor=()=>{setEditingModule(null);setEditType(null);};

        // Runs a save, shows a toast and closes the editor. Returns true on success.
        const saveWith=async(action,okMsg)=>{
            try{const updated=await action();if(updated&&updated.id)replaceModule(updated);closeEditor();add(okMsg,'ok');return true;}
            catch(e){add(e.message,'err');return false;}
        };

        const deleteModule=id=>setConfirm({msg:'Permanently delete this module and all its content?',cb:async()=>{
                setConfirm(null);
                try{await api.del('/api/owner/modules/'+id);setModules(ms=>ms.filter(m=>m.id!==id));add('Module deleted','ok');}
                catch(e){add(e.message,'err');}
            }});

        const togglePublish=async m=>{
            try{
                const updated=await api.patch('/api/owner/modules/'+m.id+'/published',{published:!m.published});
                replaceModule(updated);
                add(updated.published?'Module published — learners can now see it.':'Module unpublished (hidden from learners).',updated.published?'ok':'warn');
            }catch(e){add(e.message,'err');}
        };

        const getStats=m=>m.stats||{total:0,completed:0,started:0,pct:0};
        const totalCompletions=modules.reduce((s,m)=>s+getStats(m).completed,0);

        const TABS=[{k:'overview',icon:'📊',l:'Overview'},{k:'modules',icon:'📚',l:'Modules'},{k:'completion',icon:'📈',l:'Completion'}];

        return(
            <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex'}}>
                <Toast toasts={toasts} remove={remove}/>
                <Confirm msg={confirm?.msg} onYes={confirm?.cb} onNo={()=>setConfirm(null)}/>
                {showSecurity&&<SecurityModal onClose={()=>setShowSecurity(false)} add={add}/>}
                {/* Modals */}
                {editingModule&&editType==='info'&&(
                    <Modal title={`Edit: ${editingModule.title}`} onClose={closeEditor} width={640}>
                        <EditInfoForm module={editingModule} onSave={u=>saveWith(()=>api.put('/api/owner/modules/'+u.id,moduleBody(u)),'Saved!')}/>
                    </Modal>
                )}
                {editingModule&&editType==='video'&&(
                    <Modal title={`Video: ${editingModule.title}`} onClose={closeEditor}>
                        <EditVideoForm module={editingModule}
                                       onUpload={file=>{const fd=new FormData();fd.append('file',file);return saveWith(()=>api.upload('/api/owner/modules/'+editingModule.id+'/video',fd),'Video uploaded!');}}
                                       onSave={u=>saveWith(()=>api.put('/api/owner/modules/'+u.id,moduleBody(u)),'Video updated!')}/>
                    </Modal>
                )}
                {editingModule&&editType==='quiz'&&(
                    <Modal title={`Quiz: ${editingModule.title}`} onClose={closeEditor} width={700}>
                        <EditQuizForm module={editingModule} onSave={quiz=>saveWith(()=>api.put('/api/owner/modules/'+editingModule.id+'/questions',quiz.map(q=>({
                            id:typeof q.id==='number'?q.id:null,q:q.q,options:q.options,answer:q.answer,hint:q.hint||'',explanation:q.explanation||''
                        }))),'Quiz saved!')}/>
                    </Modal>
                )}
                {editingModule&&editType==='cert'&&(
                    <Modal title={`Certificate: ${editingModule.title}`} onClose={closeEditor}>
                        <EditCertForm module={editingModule} onSave={u=>saveWith(()=>api.put('/api/owner/modules/'+u.id,moduleBody(u)),'Certificate saved!')}/>
                    </Modal>
                )}

                {/* Sidebar */}
                <div style={{width:220,background:'var(--bg2)',borderRight:'1px solid var(--border)',padding:'1.5rem',display:'flex',flexDirection:'column',flexShrink:0,height:'100vh',position:'sticky',top:0,overflowY:'auto'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:28}}>
                        <span style={{fontSize:20}}>🛡️</span>
                        <span style={{fontFamily:'Syne,sans-serif',fontSize:14,fontWeight:800,background:'linear-gradient(135deg,#10b981,#06b6d4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>CyberShield</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:24,padding:'12px',background:'rgba(16,185,129,0.1)',borderRadius:12,border:'1px solid rgba(16,185,129,0.2)'}}>
                        <Ava initials={initialsOf(owner.name)} color='#10b981' size={34}/>
                        <div>
                            <div style={{fontSize:12,fontWeight:600}}>{owner.name}</div>
                            <div style={{fontSize:10,color:'#34d399'}}>Module Owner</div>
                        </div>
                    </div>
                    {TABS.map(t=>(
                        <button key={t.k} onClick={()=>setTab(t.k)}
                                style={{background:tab===t.k?'rgba(16,185,129,0.15)':'transparent',border:`1px solid ${tab===t.k?'rgba(16,185,129,0.4)':'transparent'}`,borderRadius:10,padding:'9px 14px',textAlign:'left',color:tab===t.k?'#34d399':'var(--textm)',fontSize:13,fontWeight:tab===t.k?600:400,display:'flex',alignItems:'center',gap:10,marginBottom:4,cursor:'pointer',transition:'all 0.15s'}}>
                            <span>{t.icon}</span>{t.l}
                        </button>
                    ))}
                    <div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:8}}>
                        <button onClick={()=>setShowSecurity(true)} style={{width:'100%',padding:'9px',background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.25)',borderRadius:10,color:'#34d399',fontSize:13,cursor:'pointer'}}>🔐 Security</button>
                        <button onClick={onLogout} style={{width:'100%',padding:'9px',background:'rgba(255,255,255,0.05)',border:'1px solid var(--border)',borderRadius:10,color:'var(--textm)',fontSize:13,cursor:'pointer'}}>Sign Out</button>
                    </div>
                </div>

                {/* Main */}
                <div style={{flex:1,overflowY:'auto'}}>
                    <div style={{maxWidth:960,margin:'0 auto',padding:'2rem'}}>
                        {loading&&<div style={{padding:'2rem',textAlign:'center',color:'var(--textm)'}}>Loading your modules…</div>}

                        {tab==='overview'&&(
                            <div style={{animation:'slide-in 0.3s ease'}}>
                                <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:4}}>Owner Dashboard</h2>
                                <p style={{color:'var(--textm)',marginBottom:24}}>Manage training content and track learner progress</p>
                                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:14,marginBottom:28}}>
                                    {[{ic:'📚',l:'Modules',v:modules.length,c:'#7c3aed'},{ic:'👥',l:'Learners',v:learners.length,c:'#06b6d4'},{ic:'✅',l:'Completions',v:totalCompletions,c:'#10b981'},{ic:'📊',l:'Avg Rate',v:modules.length?Math.round(modules.reduce((s,m)=>s+getStats(m).pct,0)/modules.length)+'%':'0%',c:'#f59e0b'}].map(s=>(
                                        <div key={s.l} style={{background:`${s.c}11`,border:`1px solid ${s.c}33`,borderRadius:14,padding:'1.25rem'}}>
                                            <div style={{fontSize:26,marginBottom:6}}>{s.ic}</div>
                                            <div style={{fontFamily:'Syne,sans-serif',fontSize:26,fontWeight:800,color:s.c}}>{s.v}</div>
                                            <div style={{fontSize:12,color:'var(--textm)'}}>{s.l}</div>
                                        </div>
                                    ))}
                                </div>
                                <h3 style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:700,marginBottom:14}}>Completion Rates</h3>
                                {!loading&&modules.length===0&&<div style={{color:'var(--textm)',fontSize:14}}>You have not created any modules yet. Go to <strong>Modules</strong> to add one.</div>}
                                {modules.map(m=>{const s=getStats(m);return(
                                    <div key={m.id} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'1.25rem 1.5rem',marginBottom:10}}>
                                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                                                <span style={{fontSize:20}}>{m.thumbnail}</span>
                                                <div>
                                                    <div style={{fontWeight:600,fontSize:14}}>{m.title} {!m.published&&<Badge color='#64748b'>Draft</Badge>}</div>
                                                    <div style={{fontSize:11,color:'var(--textm)'}}>{s.completed}/{s.total} completed · {s.started} in progress</div>
                                                </div>
                                            </div>
                                            <span style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:800,color:m.color}}>{s.pct}%</span>
                                        </div>
                                        <PBar value={s.pct} color={m.color} height={7}/>
                                    </div>
                                );})}
                            </div>
                        )}

                        {tab==='modules'&&(
                            <div style={{animation:'slide-in 0.3s ease'}}>
                                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
                                    <div>
                                        <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:4}}>Manage Modules</h2>
                                        <p style={{color:'var(--textm)'}}>Create, edit, publish and delete training modules</p>
                                    </div>
                                    <Btn variant="success" onClick={()=>setShowAdd(o=>!o)}>+ New Module</Btn>
                                </div>
                                {showAdd&&<AddModuleForm onSave={async m=>{
                                    try{const created=await api.post('/api/owner/modules',moduleBody(m));setModules(ms=>[...ms,created]);setShowAdd(false);add('Module created! Add quiz questions, then publish it.','ok');}
                                    catch(e){add(e.message,'err');}
                                }} onCancel={()=>setShowAdd(false)}/>}
                                {modules.map(m=>(
                                    <div key={m.id} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:18,marginBottom:14,overflow:'hidden'}}>
                                        <div style={{display:'flex',alignItems:'center',gap:14,padding:'1.5rem'}}>
                                            <div style={{width:52,height:52,borderRadius:14,background:`linear-gradient(135deg,${m.color}44,${m.color}22)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>{m.thumbnail}</div>
                                            <div style={{flex:1,minWidth:0}}>
                                                <div style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:700,marginBottom:4,display:'flex',alignItems:'center',gap:8}}>{m.title} <Badge color={m.published?'#10b981':'#64748b'}>{m.published?'Published':'Draft'}</Badge></div>
                                                <div style={{fontSize:12,color:'var(--textm)',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.desc}</div>
                                                <div style={{display:'flex',gap:10,fontSize:11,color:'var(--textl)',flexWrap:'wrap'}}>
                                                    <span>⏱ {m.duration}min</span>
                                                    <span>❓ {m.questionCount} questions</span>
                                                    <span>🎯 Pass {m.passingScore}%</span>
                                                    <span>📹 {m.videoName||'No video'}</span>
                                                    {m.dueDate&&<span>📅 {fmtDate(m.dueDate)}</span>}
                                                    <Badge color={m.color}>{m.category}</Badge>
                                                </div>
                                            </div>
                                            <div style={{display:'flex',gap:6,flexShrink:0,flexWrap:'wrap',justifyContent:'flex-end'}}>
                                                <Btn variant={m.published?'ghost':'success'} size="sm" onClick={()=>togglePublish(m)}>{m.published?'⏸ Unpublish':'🚀 Publish'}</Btn>
                                                <Btn variant="secondary" size="sm" onClick={()=>{setEditingModule(m);setEditType('info');}}>✏️ Edit</Btn>
                                                <Btn variant="cyan" size="sm" onClick={()=>{setEditingModule(m);setEditType('video');}}>📹 Video</Btn>
                                                <Btn variant="secondary" size="sm" onClick={()=>{setEditingModule(m);setEditType('quiz');}}>❓ Quiz</Btn>
                                                <Btn variant="amber" size="sm" onClick={()=>{setEditingModule(m);setEditType('cert');}}>🏆 Cert</Btn>
                                                <Btn variant="danger" size="sm" onClick={()=>deleteModule(m.id)}>🗑</Btn>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab==='completion'&&(
                            <div style={{animation:'slide-in 0.3s ease'}}>
                                <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:4}}>Learner Progress</h2>
                                <p style={{color:'var(--textm)',marginBottom:24}}>Detailed progress for every learner on your modules</p>
                                {!loading&&learners.length===0&&<div style={{color:'var(--textm)',fontSize:14}}>No approved learners yet.</div>}
                                {learners.map(u=>(
                                    <div key={u.id} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:'1.5rem',marginBottom:14}}>
                                        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
                                            <Ava initials={initialsOf(u.name)} color={colorFor(u.id)} size={38}/>
                                            <div><div style={{fontWeight:600}}>{u.name}</div><div style={{fontSize:12,color:'var(--textm)'}}>{u.email}</div></div>
                                        </div>
                                        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:8}}>
                                            {modules.map(m=>{const p=(u.progress||{})[m.id]||{};return(
                                                <div key={m.id} style={{background:`${m.color}11`,border:`1px solid ${m.color}33`,borderRadius:10,padding:'9px 12px'}}>
                                                    <div style={{fontSize:12,fontWeight:600,marginBottom:4}}>{m.title}</div>
                                                    {p.completed?<Badge color='#10b981'>✓ {p.score??100}%</Badge>:p.started?<Badge color='#06b6d4'>In Progress</Badge>:<Badge color='#64748b'>Not Started</Badge>}
                                                </div>
                                            );})}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    /* ─── OWNER FORMS ────────────────────────── */
    const CATEGORIES=['Threats','Access Control','Data Protection','Network Security','Compliance'];
    function AddModuleForm({onSave,onCancel}){
        const [f,setF]=useState({title:'',desc:'',content:'',category:'Threats',duration:'20',dueDate:'',thumbnail:'🔒',color:'#7c3aed',passingScore:'70'});
        const [saving,setSaving]=useState(false);
        const COLORS=['#7c3aed','#06b6d4','#10b981','#ec4899','#f59e0b','#ef4444'];
        const ICONS=['🔒','🎣','🛡️','🔐','🎭','💻','🌐','⚠️','🔑','📱','🖥️','🔍'];
        return(
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:18,padding:'1.75rem',marginBottom:16,animation:'slide-in 0.3s ease'}}>
                <h3 style={{fontFamily:'Syne,sans-serif',fontSize:16,fontWeight:700,marginBottom:18}}>➕ Create New Module</h3>
                <Inp label="Module Title *" value={f.title} onChange={v=>setF(x=>({...x,title:v}))} placeholder="e.g. Ransomware Defence"/>
                <Inp label="Description" value={f.desc} onChange={v=>setF(x=>({...x,desc:v}))} placeholder="Brief description..." rows={2}/>
                <Inp label="Training Content" value={f.content} onChange={v=>setF(x=>({...x,content:v}))} placeholder="The learning material learners read before the quiz..." rows={5}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
                    <Inp label="Duration (minutes)" value={f.duration} onChange={v=>setF(x=>({...x,duration:v}))} type="number"/>
                    <Inp label="Pass Mark (%)" value={f.passingScore} onChange={v=>setF(x=>({...x,passingScore:v}))} type="number"/>
                    <Inp label="Due Date" value={f.dueDate} onChange={v=>setF(x=>({...x,dueDate:v}))} type="date"/>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
                    <div>
                        <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Category</div>
                        <select value={f.category} onChange={e=>setF(x=>({...x,category:e.target.value}))} style={{width:'100%',padding:'11px 14px',background:'rgba(255,255,255,0.05)',border:'1.5px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:14,outline:'none'}}>
                            {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                        </select>
                    </div>
                    <div>
                        <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Icon</div>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                            {ICONS.map(ic=><button key={ic} onClick={()=>setF(x=>({...x,thumbnail:ic}))} style={{width:36,height:36,fontSize:18,background:f.thumbnail===ic?'rgba(124,58,237,0.2)':'rgba(255,255,255,0.05)',border:`1.5px solid ${f.thumbnail===ic?'#7c3aed':'var(--border)'}`,borderRadius:8,cursor:'pointer'}}>{ic}</button>)}
                        </div>
                    </div>
                </div>
                <div style={{marginBottom:16}}>
                    <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Colour</div>
                    <div style={{display:'flex',gap:8}}>
                        {COLORS.map(c=><button key={c} onClick={()=>setF(x=>({...x,color:c}))} style={{width:30,height:30,borderRadius:'50%',background:c,border:`3px solid ${f.color===c?'white':'transparent'}`,cursor:'pointer',boxShadow:f.color===c?`0 0 0 2px ${c}`:'none'}}/>)}
                    </div>
                </div>
                <div style={{background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:10,padding:'10px 14px',fontSize:12,color:'var(--cyan2)',marginBottom:16}}>
                    💡 New modules start as a <strong>Draft</strong>. Use the <strong>📹 Video</strong> and <strong>❓ Quiz</strong> buttons to add content, then <strong>🚀 Publish</strong>.
                </div>
                <div style={{display:'flex',gap:10}}>
                    <Btn variant="ghost" onClick={onCancel} style={{flex:1,justifyContent:'center'}}>Cancel</Btn>
                    <Btn variant="success" disabled={!f.title.trim()||saving} onClick={async()=>{
                        setSaving(true);
                        try{await onSave({...f,certTemplate:{title:'Certificate of Completion',subtitle:f.title,badge:'🏆',accentColor:f.color}});}
                        finally{setSaving(false);}
                    }} style={{flex:2,justifyContent:'center'}}>{saving?'Creating…':'Create Module'}</Btn>
                </div>
            </div>
        );
    }

    function EditInfoForm({module,onSave}){
        const [f,setF]=useState({...module,dueDate:module.dueDate||'',content:module.content||''});
        const [saving,setSaving]=useState(false);
        const COLORS=['#7c3aed','#06b6d4','#10b981','#ec4899','#f59e0b','#ef4444'];
        const ICONS=['🔒','🎣','🛡️','🔐','🎭','💻','🌐','⚠️','🔑','📱','🖥️','🔍'];
        return(
            <div>
                <Inp label="Title" value={f.title} onChange={v=>setF(x=>({...x,title:v}))}/>
                <Inp label="Description" value={f.desc} onChange={v=>setF(x=>({...x,desc:v}))} rows={2}/>
                <Inp label="Training Content" value={f.content} onChange={v=>setF(x=>({...x,content:v}))} rows={7} placeholder="The learning material learners read before the quiz..."/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
                    <Inp label="Duration (min)" value={String(f.duration)} onChange={v=>setF(x=>({...x,duration:v}))} type="number"/>
                    <Inp label="Pass Mark (%)" value={String(f.passingScore)} onChange={v=>setF(x=>({...x,passingScore:v}))} type="number"/>
                    <Inp label="Due Date" value={f.dueDate} onChange={v=>setF(x=>({...x,dueDate:v}))} type="date"/>
                </div>
                <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Category</div>
                    <select value={f.category} onChange={e=>setF(x=>({...x,category:e.target.value}))} style={{width:'100%',padding:'11px 14px',background:'rgba(255,255,255,0.05)',border:'1.5px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:14,outline:'none'}}>
                        {[...new Set([...CATEGORIES,f.category].filter(Boolean))].map(c=><option key={c} value={c}>{c}</option>)}
                    </select>
                </div>
                <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Icon</div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                        {ICONS.map(ic=><button key={ic} onClick={()=>setF(x=>({...x,thumbnail:ic}))} style={{width:36,height:36,fontSize:18,background:f.thumbnail===ic?'rgba(124,58,237,0.2)':'rgba(255,255,255,0.05)',border:`1.5px solid ${f.thumbnail===ic?'#7c3aed':'var(--border)'}`,borderRadius:8,cursor:'pointer'}}>{ic}</button>)}
                    </div>
                </div>
                <div style={{marginBottom:16}}>
                    <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Colour</div>
                    <div style={{display:'flex',gap:8}}>
                        {COLORS.map(c=><button key={c} onClick={()=>setF(x=>({...x,color:c}))} style={{width:30,height:30,borderRadius:'50%',background:c,border:`3px solid ${f.color===c?'white':'transparent'}`,cursor:'pointer',boxShadow:f.color===c?`0 0 0 2px ${c}`:'none'}}/>)}
                    </div>
                </div>
                <Btn onClick={async()=>{setSaving(true);await onSave(f);setSaving(false);}} disabled={saving} style={{width:'100%',justifyContent:'center'}}>{saving?'Saving…':'Save Changes'}</Btn>
            </div>
        );
    }

    function EditVideoForm({module,onSave,onUpload}){
        const [videoName,setVideoName]=useState(module.videoName||'');
        const [videoUrl,setVideoUrl]=useState(module.videoUrl||'');
        const [loading,setLoading]=useState(false);
        const fileRef=useRef();

        const handleFile=async e=>{
            const file=e.target.files[0];
            if(!file)return;
            setLoading(true);
            await onUpload(file);
            setLoading(false);
        };

        const removeVideo=()=>{setVideoUrl('');setVideoName('');};

        return(
            <div>
                <div style={{background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:12,padding:'12px 16px',fontSize:13,color:'var(--cyan2)',marginBottom:16,lineHeight:1.6}}>
                    📹 Upload a video file or paste a link (YouTube, Vimeo or a direct .mp4 link). Learners watch it before taking the quiz.<br/>
                    <span style={{color:'var(--textl)'}}>Supported uploads: MP4, WebM, OGG, MOV (max 200 MB). Files are stored on the server.</span>
                </div>
                {videoUrl?(
                    <div>
                        <VideoPlayer url={videoUrl} style={{marginBottom:12,maxHeight:220}}/>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,background:'rgba(255,255,255,0.04)',borderRadius:10,padding:'10px 14px'}}>
                            <span style={{fontSize:13,color:'var(--textm)'}}>📹 {videoName||'Linked video'}</span>
                            <Btn variant="danger" size="sm" onClick={removeVideo}>🗑 Remove Video</Btn>
                        </div>
                    </div>
                ):(
                    <div onClick={()=>!loading&&fileRef.current?.click()} style={{border:'2px dashed var(--border)',borderRadius:14,padding:'2.5rem',textAlign:'center',cursor:'pointer',marginBottom:16,transition:'border-color 0.2s'}}
                         onMouseEnter={e=>e.currentTarget.style.borderColor='var(--cyan)'}
                         onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>

                    </div>

            </div>
        );
    }

    function EditQuizForm({module,onSave}){
        const [quiz,setQuiz]=useState(()=>module.quiz&&module.quiz.length
            ?JSON.parse(JSON.stringify(module.quiz)).map(q=>({...q,hint:q.hint||'',explanation:q.explanation||''}))
            :[{id:'new'+Date.now(),q:'',options:['','','',''],answer:0,hint:'',explanation:''}]);
        const [saving,setSaving]=useState(false);
        const updateQ=(qi,k,v)=>setQuiz(q=>q.map((x,i)=>i===qi?{...x,[k]:v}:x));
        const updateOpt=(qi,oi,v)=>setQuiz(q=>q.map((x,i)=>i===qi?{...x,options:x.options.map((o,j)=>j===oi?v:o)}:x));
        const addQ=()=>setQuiz(q=>[...q,{id:'new'+Date.now(),q:'',options:['','','',''],answer:0,hint:'',explanation:''}]);
        const removeQ=qi=>setQuiz(q=>q.filter((_,i)=>i!==qi));
        return(
            <div>
                <div style={{background:'rgba(124,58,237,0.08)',border:'1px solid rgba(124,58,237,0.2)',borderRadius:12,padding:'10px 14px',fontSize:12,color:'var(--purple3)',marginBottom:16}}>
                    ✨ The <strong>Magic Hint</strong> field is shown to users after they spend 20 seconds on a question without answering.
                </div>
                <div style={{maxHeight:'55vh',overflowY:'auto',paddingRight:4}}>
                    {quiz.map((q,qi)=>(
                        <div key={q.id} style={{background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:14,padding:'1.25rem',marginBottom:12}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                                <div style={{fontWeight:700,color:'var(--purple3)',fontSize:14}}>Question {qi+1}</div>
                                {quiz.length>1&&<button onClick={()=>removeQ(qi)} style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',color:'#f87171',borderRadius:7,padding:'4px 12px',fontSize:12,cursor:'pointer'}}>✕ Remove</button>}
                            </div>
                            <Inp label="Question Text *" value={q.q} onChange={v=>updateQ(qi,'q',v)} placeholder="Type your question here..."/>
                            <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Answer Options (click the circle to mark correct answer)</div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                                {q.options.map((o,oi)=>(
                                    <div key={oi} style={{display:'flex',gap:8,alignItems:'center'}}>
                                        <button onClick={()=>updateQ(qi,'answer',oi)} style={{width:26,height:26,borderRadius:'50%',background:q.answer===oi?'var(--green)':'rgba(255,255,255,0.06)',border:`2px solid ${q.answer===oi?'var(--green)':'var(--border)'}`,cursor:'pointer',flexShrink:0,fontSize:11,fontWeight:700,color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>{String.fromCharCode(65+oi)}</button>
                                        <input value={o} onChange={e=>updateOpt(qi,oi,e.target.value)} placeholder={`Option ${String.fromCharCode(65+oi)}`}
                                               style={{flex:1,padding:'8px 10px',background:`rgba(255,255,255,${q.answer===oi?0.08:0.04})`,border:`1.5px solid ${q.answer===oi?'var(--green)':'var(--border)'}`,borderRadius:8,color:'var(--text)',fontSize:13,outline:'none'}}/>
                                    </div>
                                ))}
                            </div>
                            <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>✨ Magic Hint (shown after 20 seconds)</div>
                            <textarea value={q.hint} onChange={e=>updateQ(qi,'hint',e.target.value)} placeholder="Enter a helpful hint that guides the user towards the correct answer..." rows={2}
                                      style={{width:'100%',padding:'10px 14px',background:'rgba(124,58,237,0.08)',border:'1.5px solid rgba(124,58,237,0.3)',borderRadius:10,color:'var(--text)',fontSize:13,outline:'none',resize:'vertical',marginBottom:10}}/>
                            <div style={{fontSize:12,fontWeight:600,color:'var(--textm)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>Explanation (shown after answering)</div>
                            <textarea value={q.explanation} onChange={e=>updateQ(qi,'explanation',e.target.value)} placeholder="Why is the correct answer right?" rows={2}
                                      style={{width:'100%',padding:'10px 14px',background:'rgba(255,255,255,0.04)',border:'1.5px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:13,outline:'none',resize:'vertical'}}/>
                        </div>
                    ))}
                </div>
                <Btn variant="secondary" onClick={addQ} style={{width:'100%',justifyContent:'center',marginBottom:10,marginTop:6}}>+ Add Question</Btn>
                <Btn onClick={async()=>{setSaving(true);await onSave(quiz);setSaving(false);}} disabled={saving} style={{width:'100%',justifyContent:'center'}}>{saving?'Saving…':'💾 Save Quiz'}</Btn>
            </div>
        );
    }

    /* ─── ADMIN DASHBOARD ────────────────────── */

    function AdminDashboard({admin,onLogout}){
        const [tab,setTab]=useState('overview');
        const [search,setSearch]=useState('');
        const [roleFilter,setRoleFilter]=useState('all');
        const [statusFilter,setStatusFilter]=useState('all');
        const [selectedUser,setSelectedUser]=useState(null);
        const [modules,setModules]=useState([]);
        const [resets,setResets]=useState([]);
        const [audit,setAudit]=useState(null);
        const [showSecurity,setShowSecurity]=useState(false);
        const [confirm,setConfirm]=useState(null);
        const {toasts,add,remove}=useToast();

        const [databaseUsers,setDatabaseUsers]=useState([]);
        const [usersLoading,setUsersLoading]=useState(true);
        const [usersError,setUsersError]=useState('');

        const [ownerForm,setOwnerForm]=useState({show:false,name:'',email:'',password:''});
        const [ownerErr,setOwnerErr]=useState('');
        const [userForm,setUserForm]=useState({show:false,name:'',email:'',password:''});
        const [userErr,setUserErr]=useState('');

        const mapUser=u=>{
            const role=(u.role||'USER').toUpperCase();
            const name=u.fullName||'Unnamed user';
            return{
                id:u.id,name,email:u.email||'',phone:u.phone||'',
                role:role==='MODULE_OWNER'?'owner':role.toLowerCase(),
                databaseRole:role,
                active:!!u.enabled,
                approvalStatus:(u.approvalStatus||'APPROVED').toUpperCase(),
                twoFactorEnabled:!!u.twoFactorEnabled,
                avatar:initialsOf(name),
                color:role==='ADMIN'?'#f59e0b':role==='MODULE_OWNER'?'#10b981':'#7c3aed',
                joinDate:u.createdAt?fmtDate(u.createdAt):'N/A'
            };
        };

        const loadDatabaseUsers=async()=>{
            setUsersLoading(true);setUsersError('');
            try{
                const data=await api.get('/admin/api/users');
                const mapped=data.map(mapUser);
                setDatabaseUsers(mapped);
                setSelectedUser(sel=>sel?(mapped.find(u=>u.id===sel.id)||null):sel);
            }catch(error){setUsersError(error.message);}
            finally{setUsersLoading(false);}
        };
        const loadModules=()=>api.get('/admin/api/modules').then(setModules).catch(e=>add(e.message,'err'));
        const loadResets=()=>api.get('/admin/api/password-resets').then(setResets).catch(e=>add(e.message,'err'));
        const loadAudit=()=>api.get('/admin/api/audit-logs').then(setAudit).catch(e=>add(e.message,'err'));

        useEffect(()=>{loadDatabaseUsers();loadModules();loadResets();},[]);

        // Replace one user in the list with the version the server returned.
        const applyUser=u=>{
            const mapped=mapUser(u);
            setDatabaseUsers(list=>list.map(x=>x.id===mapped.id?mapped:x));
            setSelectedUser(sel=>sel&&sel.id===mapped.id?mapped:sel);
            return mapped;
        };

        const allUsers=useMemo(
            ()=>databaseUsers.filter(u=>u.databaseRole!=='ADMIN').sort((a,b)=>a.name.localeCompare(b.name)),
            [databaseUsers]
        );
        const statusOf=u=>u.approvalStatus==='PENDING'?'pending':u.approvalStatus==='REJECTED'?'rejected':u.active?'active':'disabled';
        const STATUS_LABEL={pending:'Pending',rejected:'Rejected',active:'Active',disabled:'Deactivated'};
        const STATUS_COLOR={pending:'#f59e0b',rejected:'#ef4444',active:'#10b981',disabled:'#ef4444'};

        const filtered=useMemo(()=>allUsers.filter(u=>{
            if(roleFilter!=='all'&&u.role!==roleFilter)return false;
            if(statusFilter!=='all'&&statusOf(u)!==statusFilter)return false;
            const term=search.trim().toLowerCase();
            return !term||[u.name,u.email,u.role].some(v=>(v||'').toLowerCase().includes(term));
        }),[search,roleFilter,statusFilter,allUsers]);

        const pendingUsers=allUsers.filter(u=>u.approvalStatus==='PENDING');
        const users=allUsers.filter(u=>u.databaseRole==='USER'&&u.approvalStatus==='APPROVED');
        const pendingResets=resets.filter(r=>r.status==='PENDING');

        const approveUser=async id=>{
            try{const u=applyUser(await api.post('/admin/api/users/'+id+'/approve'));add(u.name+' approved and activated!','ok');loadModules();}
            catch(e){add(e.message,'err');}
        };
        const rejectUser=id=>setConfirm({msg:'Reject this registration? The person will not be able to sign in.',yes:'Reject',cb:async()=>{
                setConfirm(null);
                try{applyUser(await api.post('/admin/api/users/'+id+'/reject'));add('Registration rejected','ok');}
                catch(e){add(e.message,'err');}
            }});
        const toggleActive=async u=>{
            try{
                const updated=applyUser(await api.put('/admin/api/users/'+u.id+'/status',{enabled:!u.active}));
                add(updated.name+' '+(updated.active?'activated':'deactivated'),updated.active?'ok':'warn');
            }catch(e){add(e.message,'err');}
        };
        const changeRole=async(u,role)=>{
            try{
                const updated=applyUser(await api.put('/admin/api/users/'+u.id+'/role',{role}));
                add(updated.name+' is now '+(role==='MODULE_OWNER'?'a Module Owner':'a User'),'ok');
                loadModules();
            }catch(e){add(e.message,'err');}
        };
        // Lost phone: clear the user's 2FA so they set it up again at their next sign-in.
        const resetTwoFactor=u=>setConfirm({msg:'Reset 2FA for '+u.name+'? They will have to scan a new QR code at their next sign-in.',yes:'Reset 2FA',cb:async()=>{
                setConfirm(null);
                try{const updated=applyUser(await api.post('/admin/api/users/'+u.id+'/reset-2fa'));add('2FA reset for '+updated.name,'ok');}
                catch(e){add(e.message,'err');}
            }});
        const decideReset=async(r,approve)=>{
            try{
                await api.post('/admin/api/password-resets/'+r.id+(approve?'/approve':'/reject'));
                add(approve?'New password activated for '+r.email:'Reset request rejected',approve?'ok':'warn');
                loadResets();
            }catch(e){add(e.message,'err');loadResets();}
        };

        const createAccount=async(form,role,setErr,reset,okMsg)=>{
            setErr('');
            const name=form.name.trim(),email=form.email.trim().toLowerCase(),password=form.password;
            if(!name||!email||!password){setErr('Name, email and password are required.');return;}
            if(password.length<8||!/[A-Za-z]/.test(password)||!/[0-9]/.test(password)){setErr('Password must be at least 8 characters and include a letter and a number.');return;}
            try{
                await api.post('/admin/api/users',{fullName:name,email,password,role});
                reset();
                add(okMsg,'ok');
                await loadDatabaseUsers();
            }catch(error){setErr(error.message);}
        };
        const createOwner=()=>createAccount(ownerForm,'MODULE_OWNER',setOwnerErr,()=>setOwnerForm({show:false,name:'',email:'',password:''}),'Module owner account saved to the database.');
        const createUser=()=>createAccount(userForm,'USER',setUserErr,()=>setUserForm({show:false,name:'',email:'',password:''}),'Normal user account saved to the database.');

        const TABS=[
            {k:'overview',icon:'📊',l:'Overview'},
            {k:'pending',icon:'⏳',l:'Pending',count:pendingUsers.length},
            {k:'users',icon:'👥',l:'Users'},
            {k:'owners',icon:'🏗️',l:'Owners'},
            {k:'modules',icon:'📚',l:'Modules'},
            {k:'resets',icon:'🔑',l:'Password Resets',count:pendingResets.length},
            {k:'audit',icon:'🧾',l:'Audit Log'}
        ];

        const RC={user:'#7c3aed',owner:'#10b981',admin:'#f59e0b'};
        const selectStyle={padding:'11px 12px',background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:12,color:'var(--text)',fontSize:13,outline:'none'};
        const totalCompletions=modules.reduce((s,m)=>s+(m.stats?.completed||0),0);

        return(
            <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex'}}>
                <Toast toasts={toasts} remove={remove}/>
                {confirm&&(
                    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,padding:'2rem',maxWidth:360,width:'90%',textAlign:'center',boxShadow:'0 24px 64px rgba(0,0,0,0.5)'}}>
                            <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
                            <p style={{marginBottom:24,color:'var(--textm)',lineHeight:1.6}}>{confirm.msg}</p>
                            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
                                <button onClick={()=>setConfirm(null)} style={{flex:1,padding:'11px',background:'rgba(255,255,255,0.06)',border:'1px solid var(--border)',borderRadius:10,color:'var(--text)',fontSize:14,fontWeight:600}}>Cancel</button>
                                <button onClick={confirm.cb} style={{flex:1,padding:'11px',background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.4)',borderRadius:10,color:'#f87171',fontSize:14,fontWeight:600}}>{confirm.yes||'Confirm'}</button>
                            </div>
                        </div>
                    </div>
                )}
                {showSecurity&&<SecurityModal onClose={()=>setShowSecurity(false)} add={add}/>}

                <div style={{
                    width:220,background:'var(--bg2)',borderRight:'1px solid var(--border)',
                    padding:'1.5rem',display:'flex',flexDirection:'column',
                    flexShrink:0,height:'100vh',position:'sticky',top:0,overflowY:'auto'
                }}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:28}}>
                        <span style={{fontSize:20}}>🛡️</span>
                        <span style={{
                            fontFamily:'Syne,sans-serif',fontSize:14,fontWeight:800,
                            background:'linear-gradient(135deg,#f59e0b,#ec4899)',
                            WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'
                        }}>CyberShield</span>
                    </div>

                    <div style={{
                        display:'flex',alignItems:'center',gap:10,marginBottom:24,
                        padding:12,background:'rgba(245,158,11,0.1)',
                        borderRadius:12,border:'1px solid rgba(245,158,11,0.2)'
                    }}>
                        <Ava initials={initialsOf(admin.name)} color='#f59e0b' size={34}/>
                        <div>
                            <div style={{fontSize:12,fontWeight:600}}>{admin.name}</div>
                            <div style={{fontSize:10,color:'#fbbf24'}}>System Admin</div>
                        </div>
                    </div>

                    {TABS.map(t=>(
                        <button key={t.k}
                                onClick={()=>{
                                    setTab(t.k);
                                    setSelectedUser(null);
                                    if(t.k==='pending'||t.k==='users'||t.k==='owners')loadDatabaseUsers();
                                    if(t.k==='modules'||t.k==='overview')loadModules();
                                    if(t.k==='resets')loadResets();
                                    if(t.k==='audit')loadAudit();
                                }}
                                style={{
                                    background:tab===t.k?'rgba(245,158,11,0.15)':'transparent',
                                    border:`1px solid ${tab===t.k?'rgba(245,158,11,0.4)':'transparent'}`,
                                    borderRadius:10,padding:'9px 14px',textAlign:'left',
                                    color:tab===t.k?'#fbbf24':'var(--textm)',
                                    fontSize:13,fontWeight:tab===t.k?600:400,
                                    display:'flex',alignItems:'center',gap:10,
                                    marginBottom:4,cursor:'pointer'
                                }}>
                            <span>{t.icon}</span>{t.l}
                            {t.count>0&&
                                <span style={{
                                    marginLeft:'auto',background:'var(--red)',color:'white',
                                    borderRadius:'50%',width:18,height:18,fontSize:10,
                                    fontWeight:700,display:'flex',alignItems:'center',
                                    justifyContent:'center'
                                }}>{t.count}</span>
                            }
                        </button>
                    ))}

                    <div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:8}}>
                        <button onClick={()=>setShowSecurity(true)} style={{
                            width:'100%',padding:9,background:'rgba(245,158,11,0.08)',
                            border:'1px solid rgba(245,158,11,0.25)',borderRadius:10,
                            color:'#fbbf24',fontSize:13,cursor:'pointer'
                        }}>🔐 Security</button>
                        <button onClick={onLogout} style={{
                            width:'100%',padding:9,background:'rgba(255,255,255,0.05)',
                            border:'1px solid var(--border)',borderRadius:10,
                            color:'var(--textm)',fontSize:13,cursor:'pointer'
                        }}>Sign Out</button>
                    </div>
                </div>

                <div style={{flex:1,overflowY:'auto'}}>
                    <div style={{maxWidth:1000,margin:'0 auto',padding:'2rem'}}>

                        {tab==='overview'&&(
                            <div>
                                <h2 style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,marginBottom:4}}>System Overview</h2>
                                <p style={{color:'var(--textm)',marginBottom:24}}>Platform-wide statistics</p>

                                <div style={{
                                    display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',
                                    gap:14,marginBottom:28
                                }}>
                                    {[
                                        {ic:'👤',l:'Learners',v:users.length,c:'#7c3aed'},

                                            background:`${s.c}11`,border:`1px solid ${s.c}33`,
                                            borderRadius:14,padding:'1.25rem'
                                        }}>
                                            <div style={{fontSize:26,marginBottom:6}}>{s.ic}</div>
                                            <div style={{fontFamily:'Syne,sans-serif',fontSize:26,fontWeight:800,color:s.c}}>{s.v}</div>
                                            <div style={{fontSize:12,color:'var(--textm)'}}>{s.l}</div>
                                        </div>
                                    ))}
                                </div>

                                {(pendingUsers.length>0||pendingResets.length>0)&&(
                                    <div style={{background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.25)',borderRadius:14,padding:'14px 20px',marginBottom:24,display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
                                        <span style={{fontSize:14,color:'#fbbf24'}}>⏳ {pendingUsers.length} registration(s) and {pendingResets.length} password reset(s) waiting for review</span>
                                        <div style={{display:'flex',gap:8}}>

                                                    <td style={{padding:'10px 14px',whiteSpace:'nowrap',color:'var(--textm)'}}>{fmtDateTime(a.createdAt)}</td>
                                                    <td style={{padding:'10px 14px'}}>{a.actor}</td>
                                                    <td style={{padding:'10px 14px'}}><Badge color={/FAIL|REJECT|DISABLED/.test(a.action)?'#ef4444':'#06b6d4'}>{a.action.replace(/_/g,' ')}</Badge></td>
                                                    <td style={{padding:'10px 14px',color:'var(--textm)'}}>{a.description}</td>
                                                    <td style={{padding:'10px 14px',color:'var(--textl)',whiteSpace:'nowrap'}}>{a.ipAddress}</td>
                                                </tr>
                                            ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    /* ─── ROOT ────────────────────────────────── */
    function App(){
        const [user,setUser]=useState(null);
        const [checking,setChecking]=useState(true);

        // After a page refresh, ask the server whether this browser is still signed in.
        useEffect(()=>{
            api.get('/api/auth/me')
                .then(d=>{if(d&&d.authenticated)setUser(toClientUser(d.user));})
                .catch(()=>{})
                .finally(()=>setChecking(false));
            const expired=()=>{api.resetCsrf();setUser(null);};
            window.addEventListener('cs-session-expired',expired);
            return()=>window.removeEventListener('cs-session-expired',expired);
        },[]);

        const logout=async()=>{
            try{await api.post('/api/auth/logout');}catch(e){/* already signed out */}
            api.resetCsrf();
            setUser(null);
        };

        if(checking)return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><Spinner/></div>;
        if(!user)return <LoginPage onLogin={setUser}/>;
        if(user.role==='admin')return <AdminDashboard admin={user} onLogout={logout}/>;
        if(user.role==='owner')return <OwnerDashboard owner={user} onLogout={logout}/>;
        return <UserDashboard user={user} onLogout={logout}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
